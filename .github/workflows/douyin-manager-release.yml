name: Douyin Manager Release

on:
  push:
    tags:
      - "douyin-manager-v*"
  workflow_call:
    inputs:
      version:
        description: "不带 douyin-manager-v 前缀的版本号"
        required: true
        type: string
      tag:
        description: "Release Please 已创建的标签"
        required: true
        type: string
      publish:
        description: "校验成功后发布 GitHub Pre-release"
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 0.4.1-test（不要带 douyin-manager-v 前缀）"
        required: true
        type: string
      publish:
        description: "校验成功后发布 GitHub Pre-release；关闭时只生成 Actions Artifact"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: douyin-manager-release-${{ github.ref_name }}-${{ inputs.version || 'tag' }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, verify, and release
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Resolve release metadata
        id: metadata
        env:
          CALL_VERSION: ${{ inputs.version }}
          CALL_TAG: ${{ inputs.tag }}
          CALL_PUBLISH: ${{ inputs.publish }}
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_PUBLISH: ${{ inputs.publish }}
        run: |
          $ErrorActionPreference = "Stop"
          $versionPattern = '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?$'

          if (-not [string]::IsNullOrWhiteSpace($env:CALL_TAG)) {
            $version = [string]$env:CALL_VERSION
            $tag = [string]$env:CALL_TAG
            $publish = if ($env:CALL_PUBLISH -eq "true") { "true" } else { "false" }
            if ($tag -cne "douyin-manager-v$version") {
              throw "Reusable workflow tag '$tag' does not match version '$version'."
            }
          } elseif ($env:GITHUB_EVENT_NAME -eq "push") {
            if ($env:GITHUB_REF_NAME -notmatch '^douyin-manager-v(?<version>.+)$') {
              throw "Unexpected release tag: $env:GITHUB_REF_NAME"
            }
            $version = $Matches.version
            $tag = $env:GITHUB_REF_NAME
            $publish = "true"
          } else {
            $version = [string]$env:DISPATCH_VERSION
            $tag = "douyin-manager-v$version"
            $publish = if ($env:DISPATCH_PUBLISH -eq "true") { "true" } else { "false" }
          }

          if ($version -notmatch $versionPattern) {
            throw "Invalid version '$version'. Expected a value such as 0.4.1-test."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "publish=$publish" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Check out release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release tag target
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $tagCommit = git rev-list -n 1 $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:GITHUB_SHA) {
            throw "Tag $env:RELEASE_TAG does not resolve to workflow commit $env:GITHUB_SHA."
          }

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/modules/short-videos/download-manager/package-lock.json

      - name: Install Node.js dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix src/modules/short-videos/download-manager ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            src/modules/short-videos/download-manager/packaging/requirements-build.txt
            src/modules/short-videos/download-manager/downloader/requirements.txt
            src/modules/short-videos/download-manager/downloader/pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install --no-input --requirement src/modules/short-videos/download-manager/packaging/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify manager integration
        run: |
          npm run verify:douyin-manager
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete downloader test suite
        run: |
          $ErrorActionPreference = "Stop"
          $downloaderRoot = Resolve-Path -LiteralPath "src/modules/short-videos/download-manager/downloader"
          $venvPython = Join-Path $downloaderRoot ".venv/Scripts/python.exe"
          if (-not (Test-Path -LiteralPath $venvPython -PathType Leaf)) {
            throw "Downloader virtual environment was not created: $venvPython"
          }

          & $venvPython -m pip install --no-input "pytest>=7.0" "pytest-asyncio>=0.21" "hypothesis>=6.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Push-Location $downloaderRoot
          try {
            & $venvPython -m pytest -q
            $testExit = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          exit $testExit

      - name: Build Windows installer
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          & ./tools/build_douyin_manager_installer.ps1 -Version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify release artifacts
        id: artifacts
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $outputDir = Resolve-Path -LiteralPath "dist/douyin-download-manager"
          $installerName = "DouyinDownloadManager-Setup-x64-$env:RELEASE_VERSION.exe"
          $installer = Join-Path $outputDir $installerName
          $hashFile = "$installer.sha256"

          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Installer was not generated: $installer"
          }
          if (-not (Test-Path -LiteralPath $hashFile -PathType Leaf)) {
            throw "Hash file was not generated: $hashFile"
          }

          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHashLine = "$hash  $installerName"
          $actualHashLine = (Get-Content -LiteralPath $hashFile -Raw).Trim()
          if ($actualHashLine -cne $expectedHashLine) {
            throw "SHA256 sidecar does not match the installer."
          }

          $size = (Get-Item -LiteralPath $installer).Length
          "installer=$installer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "hash_file=$hashFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "installer_name=$installerName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "size=$size" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload dry-run artifact
        if: steps.metadata.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: DouyinDownloadManager-${{ steps.metadata.outputs.version }}
          path: |
            ${{ steps.artifacts.outputs.installer }}
            ${{ steps.artifacts.outputs.hash_file }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Summarize dry run
        if: steps.metadata.outputs.publish != 'true'
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_SHA256: ${{ steps.artifacts.outputs.sha256 }}
          RELEASE_SIZE: ${{ steps.artifacts.outputs.size }}
        run: |
          @"
          ## 抖音下载管理器 $env:RELEASE_VERSION 构建完成

          本次为安全试跑，没有创建标签或 GitHub Release。

          - 安装包大小：$env:RELEASE_SIZE 字节
          - SHA256：$env:RELEASE_SHA256
          - Actions Artifact 保留 7 天
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Publish verified pre-release
        if: steps.metadata.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          INSTALLER_PATH: ${{ steps.artifacts.outputs.installer }}
          HASH_FILE_PATH: ${{ steps.artifacts.outputs.hash_file }}
          INSTALLER_NAME: ${{ steps.artifacts.outputs.installer_name }}
          EXPECTED_SHA256: ${{ steps.artifacts.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.artifacts.outputs.size }}
        run: |
          $ErrorActionPreference = "Stop"
          $repository = $env:GITHUB_REPOSITORY
          $title = "抖音下载管理器 $env:RELEASE_VERSION"
          $hashAssetName = "$env:INSTALLER_NAME.sha256"
          $hashAssetSize = (Get-Item -LiteralPath $env:HASH_FILE_PATH).Length
          $notesPath = Join-Path $env:RUNNER_TEMP "douyin-manager-release-notes.md"

          @"
          ## 自动构建信息

          此版本由 GitHub Actions 在 Windows Runner 上完成测试、打包和附件校验。

          - 源提交：$env:GITHUB_SHA
          - 完整 downloader 测试、管理器集成测试和安装包 smoke test 均已通过
          - SHA256：$env:EXPECTED_SHA256
          "@ | Set-Content -LiteralPath $notesPath -Encoding utf8

          $previousTag = git tag --sort=-version:refname --list "douyin-manager-v*" |
            Where-Object { $_ -ne $env:RELEASE_TAG } |
            Select-Object -First 1

          $existingJson = gh release view $env:RELEASE_TAG --repo $repository `
            --json isDraft,isPrerelease,targetCommitish,url 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existing = $existingJson | ConvertFrom-Json
            if (-not $existing.isDraft) {
              throw "Release $env:RELEASE_TAG is already public; refusing to overwrite it."
            }

            $remoteTagCommit = gh api "repos/$repository/commits/$env:RELEASE_TAG" --jq .sha 2>$null
            if ($LASTEXITCODE -eq 0) {
              if ($remoteTagCommit -ne $env:GITHUB_SHA) {
                throw "Existing tag resolves to $remoteTagCommit, not $env:GITHUB_SHA."
              }
            } elseif ($existing.targetCommitish -ne $env:GITHUB_SHA) {
              throw "Existing draft targets $($existing.targetCommitish), not $env:GITHUB_SHA."
            }

            gh release upload $env:RELEASE_TAG $env:INSTALLER_PATH $env:HASH_FILE_PATH `
              --repo $repository --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $createArgs = @(
              "release", "create", $env:RELEASE_TAG,
              $env:INSTALLER_PATH, $env:HASH_FILE_PATH,
              "--repo", $repository,
              "--title", $title,
              "--notes-file", $notesPath,
              "--generate-notes",
              "--draft",
              "--prerelease"
            )
            if ($previousTag) {
              $createArgs += @("--notes-start-tag", $previousTag)
            }
            if ($env:GITHUB_EVENT_NAME -eq "push") {
              $createArgs += "--verify-tag"
            } else {
              $createArgs += @("--target", $env:GITHUB_SHA)
            }

            & gh @createArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $draft = gh release view $env:RELEASE_TAG --repo $repository `
            --json isDraft,isPrerelease,assets,url | ConvertFrom-Json
          if (-not $draft.isDraft -or -not $draft.isPrerelease) {
            throw "Release must remain a draft pre-release until its assets are verified."
          }
          if ($draft.assets.Count -ne 2) {
            throw "Expected exactly 2 release assets, found $($draft.assets.Count)."
          }

          $installerAsset = $draft.assets | Where-Object name -eq $env:INSTALLER_NAME
          $hashAsset = $draft.assets | Where-Object name -eq $hashAssetName
          if (-not $installerAsset -or -not $hashAsset) {
            throw "The expected installer and SHA256 sidecar were not uploaded."
          }
          if ([long]$installerAsset.size -ne [long]$env:EXPECTED_SIZE) {
            throw "Uploaded installer size does not match the local artifact."
          }
          if ([long]$hashAsset.size -ne [long]$hashAssetSize) {
            throw "Uploaded SHA256 sidecar size does not match the local artifact."
          }

          $remoteDigest = [string]$installerAsset.digest
          $expectedDigest = "sha256:$env:EXPECTED_SHA256"
          if (-not $remoteDigest.Equals($expectedDigest, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Uploaded installer digest mismatch: $remoteDigest"
          }

          gh release edit $env:RELEASE_TAG --repo $repository `
            --title $title --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $published = gh release view $env:RELEASE_TAG --repo $repository `
            --json isDraft,isPrerelease,publishedAt,url,assets | ConvertFrom-Json
          if ($published.isDraft -or -not $published.isPrerelease -or $published.assets.Count -ne 2) {
            throw "Published release verification failed."
          }

          $tagCommit = gh api "repos/$repository/commits/$env:RELEASE_TAG" --jq .sha
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:GITHUB_SHA) {
            throw "Published tag resolves to $tagCommit, not $env:GITHUB_SHA."
          }

          @"
          ## 已发布 $title

          - Release：$($published.url)
          - 标签：$env:RELEASE_TAG
          - SHA256：$env:EXPECTED_SHA256
          - 附件：2 个，服务端摘要校验通过
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
