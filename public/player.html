<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FanHao 播放</title>
    <link rel="stylesheet" href="/css/foundation.css?v=20260717-player-startup-01" />
    <link rel="stylesheet" href="/vendor/plyr/plyr.css" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body.player-page {
        height: 100vh;
        margin: 0;
        overflow: hidden;
        background: #0b0f0d;
        color: #eef7f2;
      }
      .player-shell-page {
        height: 100vh;
      }
      .player-page-header {
        position: absolute;
        inset: 0 0 auto;
        z-index: 8;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
        box-sizing: border-box;
        padding: 16px 18px 54px;
        border: 0;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.82), rgba(0, 0, 0, 0.34) 58%, transparent);
        pointer-events: none;
        transition: opacity 180ms ease, transform 180ms ease;
      }
      .player-page-header h1 {
        margin: 0;
        max-width: min(1100px, calc(100% - 150px));
        overflow: hidden;
        color: #fff;
        font-size: clamp(15px, 1.25vw, 21px);
        line-height: 1.4;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.82);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .player-sidebar-toggle {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 7px;
        min-height: 36px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 999px;
        background: rgba(6, 10, 8, 0.62);
        color: #eef7f2;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        font-weight: 900;
        padding: 7px 11px;
        pointer-events: auto;
        backdrop-filter: blur(12px);
        transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
      }
      .player-sidebar-toggle:hover,
      .player-sidebar-toggle:focus-visible {
        border-color: rgba(96, 211, 170, 0.72);
        background: rgba(19, 61, 46, 0.74);
        outline: none;
      }
      .player-sidebar-toggle:active {
        transform: scale(0.97);
      }
      .player-sidebar-toggle svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.7;
      }
      body.player-ui-idle .player-page-header:not(:focus-within) {
        opacity: 0;
        transform: translateY(-8px);
      }
      .player-page-main {
        display: grid;
        height: 100vh;
        grid-template-columns: minmax(0, 1fr) minmax(280px, 320px);
        gap: 10px;
        box-sizing: border-box;
        padding: 8px;
        transition: grid-template-columns 200ms ease, gap 200ms ease;
      }
      body.player-sidebar-collapsed .player-page-main {
        grid-template-columns: minmax(0, 1fr) 0;
        gap: 0;
      }
      .player-stage {
        position: relative;
        display: grid;
        width: 100%;
        height: calc(100vh - 16px);
        min-height: 0;
        place-items: center;
        overflow: hidden;
        border-radius: 10px;
        background: #000;
      }
      .player-stage:fullscreen {
        width: 100vw;
        height: 100vh;
        background: #000;
        border-radius: 0;
      }
      .player-stage video {
        width: 100%;
        height: 100%;
        max-height: none;
        border-radius: 0;
        background: #000;
        object-fit: contain;
      }
      .player-stage .plyr {
        position: relative;
        display: block;
        width: min(100%, var(--player-video-max-width, 100%));
        height: auto;
        max-height: 100%;
        overflow: hidden;
        border-radius: 0;
        aspect-ratio: var(--player-video-aspect, 16 / 9);
        --plyr-color-main: #60d3aa;
        --plyr-video-background: #000;
      }
      .player-frame-hold {
        position: absolute;
        inset: 0;
        z-index: 3;
        border-radius: inherit;
        background: #000;
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        opacity: 1;
        pointer-events: none;
        transition: opacity 180ms ease;
      }
      .player-frame-hold[hidden] {
        display: none !important;
      }
      .player-frame-hold.fading {
        opacity: 0;
      }
      .player-stage .plyr__video-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
        max-height: none;
        overflow: hidden;
        aspect-ratio: var(--player-video-aspect, 16 / 9) !important;
      }
      .player-stage.stream-controls .plyr__video-wrapper {
        aspect-ratio: var(--player-video-aspect, 16 / 9);
      }
      .player-stage.stream-switching .plyr__controls {
        opacity: 1 !important;
        pointer-events: auto !important;
        transform: translateY(0) !important;
      }
      .player-stage.stream-switching .player-seek-control {
        opacity: 1 !important;
      }
      .player-seek-control {
        display: grid;
        gap: 8px;
        min-width: 0;
        padding: 0;
      }
      .player-seek-control[hidden] {
        display: none !important;
      }
      .player-stage.stream-controls .player-seek-control {
        display: flex;
        flex: 1 1 auto;
        align-items: center;
        gap: 8px;
        margin: 0 4px;
        min-width: 180px;
      }
      .player-status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-width: 0;
      }
      .player-mode-text {
        min-width: 0;
        overflow: hidden;
        color: rgba(255, 255, 255, 0.78);
        font-size: 11px;
        font-weight: 800;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .player-status-text {
        flex: 0 0 auto;
        color: rgba(96, 211, 170, 0.95);
        font-size: 11px;
        font-weight: 900;
      }
      .player-stage.stream-controls .player-status-row {
        display: none;
      }
      .player-timeline-row {
        display: grid;
        grid-template-columns: 50px minmax(0, 1fr) 56px;
        align-items: center;
        gap: 9px;
        min-width: 0;
      }
      .player-stage.stream-controls .player-timeline-row {
        flex: 1 1 auto;
        grid-template-columns: minmax(90px, 1fr) 78px;
      }
      .player-seek-time {
        min-width: 0;
        color: rgba(255, 255, 255, 0.82);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        font-weight: 800;
        text-align: center;
      }
      .player-seek-range {
        width: 100%;
        min-width: 0;
        height: 18px;
        accent-color: #60d3aa;
        cursor: pointer;
      }
      .player-stage.stream-controls #playerCurrentTime {
        display: none;
      }
      .player-playback-tools {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-width: 0;
      }
      .player-stage.stream-controls .player-playback-tools {
        flex: 0 0 auto;
        justify-content: flex-start;
      }
      .player-playback-tools[hidden] {
        display: none !important;
      }
      .player-playback-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .player-playback-buttons button {
        min-width: 48px;
        border: 0;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.12);
        color: rgba(255, 255, 255, 0.92);
        cursor: pointer;
        font: inherit;
        font-size: 11px;
        font-weight: 900;
        padding: 5px 8px;
      }
      .player-playback-buttons button:hover {
        background: rgba(96, 211, 170, 0.22);
      }
      .player-playback-buttons button:disabled {
        cursor: progress;
        opacity: 0.65;
      }
      .player-stage.stream-controls .player-playback-buttons button {
        min-width: 0;
        background: transparent;
        border-radius: 3px;
        color: rgba(255, 255, 255, 0.88);
        padding: 5px 6px;
      }
      .player-stage.stream-controls .player-playback-buttons button:hover {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
      }
      .player-stage video[hidden],
      .player-notice[hidden],
      .player-stream-start[hidden] {
        display: none !important;
      }
      .player-stream-start {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 7;
        display: grid;
        width: 64px;
        height: 64px;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: rgba(96, 211, 170, 0.94);
        color: #fff;
        cursor: pointer;
        transform: translate(-50%, -50%);
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.34);
        transition: transform 150ms ease, background 150ms ease;
      }
      .player-stream-start:hover,
      .player-stream-start:focus-visible {
        background: #75e3bc;
        outline: 2px solid rgba(255, 255, 255, 0.82);
        outline-offset: 3px;
        transform: translate(-50%, -50%) scale(1.06);
      }
      .player-stream-start svg {
        width: 28px;
        height: 28px;
        fill: currentColor;
        transform: translateX(2px);
      }
      .player-stage.stream-pending .plyr__control--overlaid {
        display: none;
      }
      .player-notice {
        position: absolute;
        inset: 0;
        display: grid;
        min-height: 0;
        place-items: center;
        border: 0;
        border-radius: inherit;
        background: #050706;
        color: rgba(238, 247, 242, 0.72);
        font-weight: 800;
      }
      .player-side {
        display: grid;
        height: calc(100vh - 16px);
        min-width: 0;
        align-content: start;
        gap: 14px;
        overflow: auto;
        box-sizing: border-box;
        scrollbar-color: rgba(96, 211, 170, 0.32) transparent;
        transition: opacity 160ms ease, transform 200ms ease, visibility 200ms ease;
      }
      body.player-sidebar-collapsed .player-side {
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
        transform: translateX(18px);
      }
      .player-panel {
        border: 1px solid rgba(255, 255, 255, 0.11);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        padding: 12px;
      }
      .player-panel h2 {
        margin: 0 0 10px;
        font-size: 14px;
      }
      .player-file-button {
        display: grid;
        width: 100%;
        gap: 4px;
        margin-top: 8px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.06);
        color: inherit;
        cursor: pointer;
        padding: 10px;
        text-align: left;
      }
      .player-file-button.active {
        border-color: rgba(96, 211, 170, 0.6);
        background: rgba(96, 211, 170, 0.13);
      }
      .player-file-button strong,
      .player-file-button span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .player-file-button span {
        color: rgba(238, 247, 242, 0.62);
        font-size: 12px;
      }
      .player-meta-row {
        display: grid;
        grid-template-columns: 64px minmax(0, 1fr);
        gap: 10px;
        padding: 8px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 13px;
      }
      .player-meta-row:first-of-type {
        border-top: 0;
      }
      .player-meta-row span:first-child {
        color: rgba(238, 247, 242, 0.62);
        font-weight: 800;
      }
      .player-meta-row span:last-child {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .player-entity-row {
        display: grid;
        grid-template-columns: 64px minmax(0, 1fr);
        gap: 10px;
        padding: 8px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 13px;
      }
      .player-entity-row > span {
        color: rgba(238, 247, 242, 0.62);
        font-weight: 800;
      }
      .player-entity-chips {
        display: flex;
        min-width: 0;
        flex-wrap: wrap;
        gap: 6px;
      }
      .player-entity-chip {
        border: 1px solid rgba(96, 211, 170, 0.26);
        border-radius: 8px;
        background: rgba(96, 211, 170, 0.08);
        color: #bff5de;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        font-weight: 800;
        line-height: 1.25;
        padding: 5px 8px;
      }
      .player-actions-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .player-actions-row a,
      .player-actions-row button {
        border: 1px solid rgba(96, 211, 170, 0.28);
        border-radius: 8px;
        background: rgba(96, 211, 170, 0.09);
        color: #bff5de;
        cursor: pointer;
        font: inherit;
        font-weight: 900;
        padding: 8px 10px;
        text-decoration: none;
      }
      .player-actions-row button.active {
        border-color: rgba(96, 211, 170, 0.54);
        background: rgba(96, 211, 170, 0.18);
      }
      .player-actions-row button.danger {
        border-color: rgba(245, 113, 113, 0.44);
        background: rgba(245, 113, 113, 0.12);
        color: #ffd1d1;
      }
      .player-actions-row button.danger:hover {
        background: rgba(245, 113, 113, 0.2);
      }
      .player-actions-row button:disabled {
        cursor: progress;
        opacity: 0.72;
      }
      .player-move-backdrop {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        padding: 18px;
        background: rgba(0, 0, 0, 0.62);
      }
      .player-move-dialog {
        width: min(560px, 100%);
        max-height: calc(100vh - 36px);
        overflow: auto;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: #111815;
        color: #eef7f2;
        box-shadow: 0 24px 72px rgba(0, 0, 0, 0.42);
      }
      .player-move-head,
      .player-move-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .player-move-foot {
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        border-bottom: 0;
      }
      .player-move-head h2 {
        margin: 0;
        font-size: 16px;
      }
      .player-move-body {
        display: grid;
        gap: 12px;
        padding: 14px;
      }
      .player-move-tabs {
        display: inline-flex;
        width: fit-content;
        overflow: hidden;
        border: 1px solid rgba(96, 211, 170, 0.26);
        border-radius: 8px;
      }
      .player-move-tabs button,
      .player-move-foot button,
      .player-move-head button {
        border: 0;
        background: transparent;
        color: #bff5de;
        cursor: pointer;
        font: inherit;
        font-weight: 900;
        padding: 8px 10px;
      }
      .player-move-tabs button.active {
        background: rgba(96, 211, 170, 0.17);
        color: #eef7f2;
      }
      .player-move-field {
        display: grid;
        gap: 6px;
      }
      .player-move-field span {
        color: rgba(238, 247, 242, 0.66);
        font-size: 12px;
        font-weight: 900;
      }
      .player-move-field input,
      .player-move-field select {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.06);
        color: #eef7f2;
        font: inherit;
        padding: 10px;
      }
      .player-move-field select option {
        background: #111815;
      }
      .player-move-status {
        min-height: 18px;
        color: rgba(238, 247, 242, 0.7);
        font-size: 12px;
        font-weight: 800;
      }
      .player-move-foot button.primary {
        border-radius: 8px;
        background: rgba(96, 211, 170, 0.18);
      }
      .player-move-foot button:disabled {
        cursor: progress;
        opacity: 0.7;
      }
      @media (max-width: 900px) {
        .player-page-main {
          grid-template-columns: 1fr;
          gap: 0;
          padding: 0;
        }
        body.player-sidebar-collapsed .player-page-main {
          grid-template-columns: 1fr;
        }
        .player-stage {
          height: 100vh;
          border-radius: 0;
        }
        .player-page-header {
          padding: 12px 12px 48px;
        }
        .player-page-header h1 {
          max-width: calc(100% - 118px);
        }
        .player-side {
          position: fixed;
          inset: 58px 8px 8px auto;
          z-index: 12;
          width: min(360px, calc(100vw - 24px));
          height: auto;
          padding: 10px;
          border: 1px solid rgba(255, 255, 255, 0.12);
          border-radius: 12px;
          background: rgba(11, 17, 14, 0.96);
          box-shadow: -18px 0 64px rgba(0, 0, 0, 0.42);
          backdrop-filter: blur(18px);
        }
        body.player-sidebar-collapsed .player-side {
          transform: translateX(calc(100% + 18px));
        }
        .player-playback-tools,
        .player-status-row {
          align-items: stretch;
          flex-direction: column;
        }
        .player-timeline-row {
          grid-template-columns: 46px minmax(0, 1fr) 54px;
        }
      }
      @media (max-width: 640px) {
        .player-page-header {
          padding: 10px 10px 44px;
        }
        .player-page-header h1 {
          display: -webkit-box;
          overflow: hidden;
          max-width: calc(100% - 62px);
          font-size: 14px;
          white-space: normal;
          -webkit-box-orient: vertical;
          -webkit-line-clamp: 2;
        }
        .player-sidebar-toggle {
          width: 38px;
          min-height: 38px;
          justify-content: center;
          padding: 0;
        }
        .player-sidebar-toggle-label {
          display: none;
        }
        .player-stage.stream-controls .plyr__controls {
          flex-wrap: wrap;
          gap: 6px;
          padding: 8px;
        }
        .player-stage.stream-controls .plyr__volume input[type="range"] {
          display: none;
        }
        .player-stage.stream-controls .player-seek-control {
          position: absolute;
          right: 8px;
          bottom: 8px;
          left: 8px;
          z-index: 6;
          order: 20;
          display: grid;
          width: auto;
          min-width: 0;
          gap: 6px;
          margin: 0;
          box-sizing: border-box;
          border: 1px solid rgba(255, 255, 255, 0.11);
          border-radius: 6px;
          background: rgba(255, 255, 255, 0.05);
          padding: 8px;
        }
        .player-stage.stream-controls .player-timeline-row {
          width: 100%;
          grid-template-columns: minmax(0, 1fr) auto;
          gap: 8px;
        }
        .player-stage.stream-controls .player-playback-tools {
          width: 100%;
        }
        .player-stage.stream-controls .player-playback-buttons {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          width: 100%;
          gap: 6px;
        }
        .player-stage.stream-controls .player-playback-buttons button {
          min-height: 30px;
          padding: 6px 4px;
          text-align: center;
        }
        .player-side {
          gap: 10px;
        }
        .player-panel {
          padding: 10px;
        }
        .player-meta-row,
        .player-entity-row {
          grid-template-columns: 54px minmax(0, 1fr);
          gap: 8px;
        }
      }
    </style>
  </head>
  <body class="player-page">
    <div class="player-shell-page">
      <main class="player-page-main">
        <section class="player-stage">
          <header class="player-page-header">
            <h1 id="playerTitle">FanHao 播放</h1>
            <button class="player-sidebar-toggle" id="toggleSidebarButton" type="button" aria-controls="playerSidebar" aria-expanded="true" title="隐藏资料与操作（I）">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <rect x="2.5" y="3" width="15" height="14" rx="2"></rect>
                <path d="M13 3v14M5.5 7h4M5.5 10h4M5.5 13h4"></path>
              </svg>
              <span class="player-sidebar-toggle-label">隐藏资料</span>
            </button>
          </header>
          <div class="player-notice" id="playerNotice">正在读取作品</div>
          <video id="playerVideo" playsinline preload="metadata" hidden></video>
          <button class="player-stream-start" id="playerStreamStart" type="button" aria-label="开始播放" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"></path></svg>
          </button>
          <div class="player-seek-control" id="playerSeekControl" hidden>
            <div class="player-status-row">
              <div class="player-mode-text" id="playerModeText"></div>
              <div class="player-status-text" id="playerStatusText"></div>
            </div>
            <div class="player-timeline-row">
              <span class="player-seek-time" id="playerCurrentTime">0:00</span>
              <input class="player-seek-range" id="playerSeekRange" type="range" min="0" max="0" value="0" step="0.1" aria-label="播放进度" />
              <span class="player-seek-time" id="playerDurationTime">0:00</span>
            </div>
            <div class="player-playback-tools" id="playerTools" hidden>
              <div class="player-playback-buttons">
                <button id="skipBackButton" type="button">-10s</button>
                <button id="skipForwardButton" type="button">+30s</button>
                <button id="reloadStreamButton" type="button">刷新流</button>
              </div>
            </div>
          </div>
        </section>
        <aside class="player-side" id="playerSidebar" aria-label="作品资料与操作">
          <section class="player-panel">
            <h2>视频文件</h2>
            <div id="playerFiles"></div>
          </section>
          <section class="player-panel">
            <h2>作品资料</h2>
            <div id="playerMeta"></div>
          </section>
          <section class="player-panel">
            <h2>操作</h2>
            <div class="player-actions-row">
              <button id="backButton" type="button">返回资料库</button>
              <button id="markerAButton" type="button">标记 A</button>
              <button id="correctActorButton" type="button" hidden>订正演员</button>
              <button id="moveToPersonButton" type="button" hidden>迁移演员</button>
