<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f7a62" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="资料库" />
    <title>个人视频资料库</title>
    <link rel="manifest" href="/manifest.webmanifest?v=20260701-gallery-merge-01" />
    <link rel="icon" href="/app-icon.svg?v=20260701-gallery-merge-01" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/app-icon.svg?v=20260701-gallery-merge-01" />
    <style>html.app-styles-loading body { visibility: hidden; }</style>
    <script>
      (() => {
        document.documentElement.classList.add("app-styles-loading");
        const shortVideoEntry = /^\/(?:short-videos|short-video|douyin)(?:\/|$)/.test(window.location.pathname);
        const shortVideoModuleUrl = "/short-video-app.min.js?v=bundle-801eafd2ce68";
        if (shortVideoEntry) {
          const modulePreload = document.createElement("link");
          modulePreload.rel = "modulepreload";
          modulePreload.href = shortVideoModuleUrl;
          modulePreload.fetchPriority = "high";
          document.head.append(modulePreload);
          window.__fanhaoShortVideoModuleUrl = shortVideoModuleUrl;
        }
        const shortVideoStyleUrls = [
          "/css/foundation.css?v=20260710-web-css-modules-01",
          "/css/shell.css?v=20260713-search-index-02",
          "/modules/short-videos/styles/list.css?v=20260716-personal-value-health-01",
          "/modules/short-videos/styles/viewer.css?v=20260715-first-frame-13",
          "/modules/short-videos/styles/gallery-navigation.css?v=20260711-player-modal-focus-75",
          "/modules/short-videos/styles/panels.css?v=20260720-transcode-page-concurrency-05",
          "/modules/short-videos/styles/responsive.css?v=20260715-aggregate-search-01"
        ];
        const shortVideoViewerStyleUrls = [
          "/modules/short-videos/styles/viewer.css?v=20260715-first-frame-13",
          "/modules/short-videos/styles/gallery-navigation.css?v=20260711-player-modal-focus-75"
        ];
        const fanhaoStyleUrls = [
          "/css/foundation.css?v=20260710-web-css-modules-01",
          "/css/shell.css?v=20260713-search-index-02",
          "/modules/fanhao/styles.css?v=20260717-studio-detail-01",
          "/modules/fanhao/work-cards.css?v=20260717-fanhao-viewport-render-01",
          "/modules/system/admin.css?v=20260712-module-settings-02",
          "/css/player.css?v=20260710-web-css-modules-01",
          "/css/responsive.css?v=20260712-module-settings-02"
        ];
        const shortVideoDetailEntry = /^\/(?:short-videos|short-video|douyin)\/(?!(?:stats|authors|transcoding)(?:\/|$))[^/]+\/?$/.test(window.location.pathname);
        const standaloneStyleEntry = /^\/(?:gallery|photo|photos|photo-sets|manga|media|video|videos|movie|movies|tv|novel|novels|music|musics|songs|tools)(?:\/|$)/.test(window.location.pathname) || /^\/western\/.+/.test(window.location.pathname);
        const styleUrls = shortVideoEntry
          ? (shortVideoDetailEntry
            ? shortVideoStyleUrls
            : shortVideoStyleUrls.filter((href) => !shortVideoViewerStyleUrls.includes(href)))
          : standaloneStyleEntry
            ? ["/styles.css?v=20260720-transcode-page-concurrency-05"]
            : fanhaoStyleUrls;
        const stylePromises = new Map();
        const loadStyle = (href) => {
          if (stylePromises.has(href)) return stylePromises.get(href);
          const promise = new Promise((resolve) => {
            const link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = href;
            link.fetchPriority = "high";
            link.addEventListener("load", resolve, { once: true });
            link.addEventListener("error", resolve, { once: true });
            document.head.append(link);
          });
          stylePromises.set(href, promise);
          return promise;
        };
        const loadStyleUrls = (urls) => Promise.all(urls.map(loadStyle));
        window.__fanhaoEnsureShortVideoViewerStyles = () => loadStyleUrls(shortVideoViewerStyleUrls);
        window.__fanhaoStylesReady = loadStyleUrls(styleUrls)
          .finally(() => document.documentElement.classList.remove("app-styles-loading"));
      })();
    </script>
  </head>
  <body>
    <script>
      if (/^\/(?:gallery|photo|photos|photo-sets|manga|media|video|videos|movie|movies|tv|novel|novels|short-videos|short-video|douyin|music|musics|songs|tools)(?:\/|$)/.test(window.location.pathname) || /^\/western\/.+/.test(window.location.pathname)) {
        document.body.classList.add("standalone-module-view");
      }
      if (/^\/music(?:\/|$)/.test(window.location.pathname)) document.body.classList.add("music-view");
    </script>
    <header class="product-topbar" aria-label="资料库模块">
      <a class="product-brand" href="/fanhao" aria-label="返回 FanHao 番号库">
        <span class="product-logo">FH</span>
        <span class="product-brand-text">
          <strong>FanHao</strong>
          <small>个人资料库</small>
        </span>
      </a>
      <nav class="product-nav" aria-label="主模块切换">
        <a class="product-tab active" href="/fanhao" target="_blank" rel="noopener" data-module-navigation="window" data-product-view="people" aria-current="page">番号</a>
        <a class="product-tab" href="/photo" target="_blank" rel="noopener" data-module-navigation="window" data-product-view="gallery" data-gallery-mode="photo">图库</a>
        <a class="product-tab" href="/media" target="_blank" rel="noopener" data-module-navigation="window" data-product-view="gallery" data-gallery-mode="media">影视</a>
        <a class="product-tab" href="/novels" target="_blank" rel="noopener" data-module-navigation="window" data-product-view="novels">小说</a>
        <a class="product-tab" href="/short-videos" target="_blank" rel="noopener" data-module-navigation="window" data-product-view="shortVideos">短视频</a>
        <a class="product-tab" href="/music" target="_blank" rel="noopener" data-module-navigation="window" data-product-view="music">音乐</a>
        <a class="product-tab" href="/tools" target="_blank" rel="noopener" data-module-navigation="window" data-product-view="tools">小工具</a>
        <a class="product-tab" href="/modules/market-dashboard/index.html" target="_blank" rel="noopener" data-module-navigation="window" data-product-view="marketDashboard">行情</a>
      </nav>
      <div class="product-actions">
        <button class="product-action" id="topRescanButton" type="button">后台作业</button>
        <a class="product-action" href="/android-update">手机端</a>
        <a class="product-action" id="topAdminLink" href="/admin">设置</a>
      </div>
    </header>
    <div class="app-shell">
      <aside class="sidebar fanhao-sidebar" aria-label="番号二级菜单">
        <div class="fanhao-sidebar-heading">
          <span class="eyebrow">番号</span>
          <h2>资料库</h2>
        </div>
        <nav class="view-tabs fanhao-subnav" aria-label="番号资料库视图">
          <button class="view-tab active" type="button" data-view="people" aria-pressed="true">人物</button>
          <button class="view-tab" type="button" data-view="studios" aria-pressed="false">厂商</button>
          <button class="view-tab" type="button" data-view="rankings" aria-pressed="false">排行</button>
          <button class="view-tab" type="button" data-view="vr" aria-pressed="false">VR</button>
          <button class="view-tab" type="button" data-view="favorites" aria-pressed="false">收藏</button>
          <button class="view-tab" type="button" data-view="history" aria-pressed="false">历史</button>
        </nav>
      </aside>

      <main class="main">
        <header class="toolbar">
          <div class="toolbar-title">
            <button class="toolbar-back" id="backToPeopleIndex" type="button" hidden>返回索引</button>
            <div class="eyebrow" id="currentPath">G:\</div>
            <h2 id="currentTitle">全部人物</h2>
          </div>
          <label class="search-box work-search">
            <span aria-hidden="true">⌕</span>
            <input id="workSearch" type="search" placeholder="搜索番号 / 标题 / 人物 / 类别 / 片商" autocomplete="off" aria-label="搜索番号、标题、人物、类别或片商" />
          </label>
          <div class="toolbar-controls">
            <label class="toggle-control" title="显示 JavDB 有记录但本地没有文件的作品">
              <input id="missingLocalToggle" type="checkbox" checked />
              <span>显示未下载</span>
            </label>
            <label class="toggle-control" title="显示 OFJE 等合集作品">
              <input id="collectionToggle" type="checkbox" />
              <span>显示合集</span>
            </label>
            <button class="filter-rule-button" id="compilationConfigButton" type="button">设置</button>
          </div>
        </header>

        <section class="person-profile" id="personProfile" hidden></section>
        <section class="stats-row" id="statsRow"></section>
        <section class="work-grid" id="workGrid" aria-live="polite"></section>
      </main>
    </div>

    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
    <div class="admin-backdrop" id="adminBackdrop" hidden></div>
    <section class="admin-modal" id="adminModal" role="dialog" aria-modal="true" aria-labelledby="adminTitle" aria-hidden="true" tabindex="-1">
      <header class="admin-header">
        <div>
          <div class="eyebrow">本机后台控制台</div>
          <h3 id="adminTitle">脚本与维护后台</h3>
        </div>
        <button class="icon-button" id="closeAdmin" type="button" title="关闭" aria-label="关闭">
          <span aria-hidden="true">×</span>
        </button>
      </header>
      <div class="admin-content">
        <section class="admin-overview" aria-label="后台概览">
          <div class="admin-metric">
            <span>登记脚本</span>
            <strong id="adminScriptCount">-</strong>
          </div>
          <div class="admin-metric">
            <span>运行中</span>
            <strong id="adminRunningCount">-</strong>
          </div>
          <div class="admin-metric">
            <span>最近完成</span>
            <strong id="adminDoneCount">-</strong>
          </div>
          <div class="admin-metric">
            <span>异常</span>
            <strong id="adminErrorCount">-</strong>
          </div>
        </section>
        <section class="admin-section admin-script-section">
          <div class="admin-section-head">
            <div>
              <div class="admin-section-title">脚本控制</div>
              <p class="admin-section-subtitle">登记过的工具脚本可以在这里配置参数、启动、停止并查看日志。</p>
            </div>
            <div class="admin-script-toolbar">
              <label class="admin-field compact">
                <span>分类</span>
                <select id="adminScriptCategory" aria-label="脚本分类"></select>
              </label>
              <button class="folder-button compact" id="adminRefreshScripts" type="button">刷新</button>
            </div>
          </div>
          <div class="admin-script-console">
            <div class="admin-script-list" id="adminScriptList" aria-label="脚本列表"></div>
            <form class="admin-script-panel" id="adminScriptForm">
              <div class="admin-script-panel-head">
                <div>
                  <div class="eyebrow" id="adminSelectedScriptCategory">脚本</div>
                  <h4 id="adminSelectedScriptTitle">选择一个脚本</h4>
                </div>
                <span id="adminSelectedScriptRuntime" class="admin-script-runtime">-</span>
              </div>
              <p class="admin-script-description" id="adminSelectedScriptDescription">从左侧选择脚本后，可以调整参数并启动任务。</p>
              <div class="admin-script-fields" id="adminScriptFields"></div>
              <div class="admin-actions">
                <button class="folder-button" id="adminRunScript" type="submit">运行脚本</button>
              </div>
              <p class="admin-status" id="adminScriptStatus"></p>
            </form>
          </div>
        </section>
        <section class="admin-section">
          <label class="admin-field">
            <span>人物</span>
            <select id="adminPersonSelect" aria-label="选择人物"></select>
          </label>
          <div class="admin-actions">
            <button class="folder-button" id="adminRescanPerson" type="button">刷新本地检测</button>
            <button class="folder-button" id="adminRefreshActor" type="button">刷新缺失检测</button>
            <button class="folder-button" id="adminRefreshRankings" type="button">刷新排行榜</button>
          </div>
          <p class="admin-status" id="adminStatus"></p>
        </section>
        <section class="admin-section">
          <div class="admin-section-head">
            <div>
              <div class="admin-section-title">演员头像</div>
              <p class="admin-section-subtitle">头像目录在资料库设置中统一维护，这里只执行扫描和导入。</p>
            </div>
            <a class="folder-button compact" href="/admin#settings">配置目录</a>
          </div>
          <div class="admin-actions">
            <button class="folder-button" id="adminPreviewActorAvatars" type="button">预览候选</button>
            <button class="folder-button" id="adminImportActorAvatars" type="button">扫描本地头像</button>
          </div>
          <div class="admin-avatar-candidates" id="adminActorAvatarCandidates"></div>
        </section>
        <section class="admin-section">
          <div class="admin-section-title">封面缓存</div>
          <label class="admin-field compact">
            <span>本次生成数量</span>
            <input id="adminCoverLimit" type="number" min="1" max="200" step="1" value="20" />
          </label>
          <div class="admin-actions">
            <button class="folder-button" id="adminGenerateCovers" type="button">批量补封面</button>
          </div>
          <p class="admin-status" id="adminCoverStatus"></p>
        </section>
        <section class="admin-section">
          <div class="admin-section-title">任务日志</div>
          <div class="admin-task-list" id="adminTaskList"></div>
        </section>
      </div>
    </section>
    <section class="detail-drawer" id="detailDrawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true" tabindex="-1">
      <header class="drawer-header">
        <div>
          <div class="eyebrow" id="drawerPath"></div>
          <h3 id="drawerTitle"></h3>
        </div>
        <button class="icon-button" id="closeDrawer" type="button" title="关闭" aria-label="关闭">
          <span aria-hidden="true">×</span>
        </button>
      </header>

      <div class="drawer-content">
        <div class="player-area" id="playerArea"></div>
        <aside class="drawer-side">
          <div class="meta-area" id="metaArea"></div>
          <div class="info-area" id="infoArea"></div>
        </aside>
      </div>
    </section>

    <template id="placeholderTemplate">
      <div class="placeholder-cover">
        <span>NO COVER</span>
      </div>
    </template>

    <script type="module">
      const pathname = window.location.pathname;
      const shortVideoEntry = /^\/(?:short-videos|short-video|douyin)(?:\/|$)/.test(pathname);
      const standaloneEntry = /^\/(?:gallery|photo|photos|photo-sets|manga|media|video|videos|movie|movies|tv|novel|novels|music|musics|songs|tools)(?:\/|$)/.test(pathname) || /^\/western\/.+/.test(pathname);
      if (shortVideoEntry) {
        const shortVideoModulePromise = import("/short-video-app.min.js?v=bundle-801eafd2ce68");
        await window.__fanhaoStylesReady;
        await shortVideoModulePromise;
      } else if (standaloneEntry) {
        await window.__fanhaoStylesReady;
        await import("/standalone-app.js?v=20260717-photo-library-workspace-01");
      } else {
        await window.__fanhaoStylesReady;
        await import("/fanhao-app.js?v=20260724-person-local-refresh-01");
      }
    </script>
  </body>
</html>
