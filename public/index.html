<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f7a62" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="资料库" />
    <title>个人视频资料库</title>
    <link rel="manifest" href="/manifest.webmanifest?v=20260701-gallery-merge-01" />
    <link rel="icon" href="/app-icon.svg?v=20260701-gallery-merge-01" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/app-icon.svg?v=20260701-gallery-merge-01" />
    <style>
      html.app-styles-loading body,
      html.app-module-loading body {
        visibility: hidden;
      }
      #appStartupNotice {
        box-sizing: border-box;
        display: grid;
        gap: 12px;
        width: calc(100% - 32px);
        max-width: 720px;
        margin: 24px auto;
        padding: 20px;
        border: 1px solid #91a79f;
        border-radius: 12px;
        background: #f5faf7;
        color: #18382d;
        font: 16px/1.55 system-ui, sans-serif;
        overflow-wrap: anywhere;
      }
      #appStartupNotice h2, #appStartupNotice p { margin: 0; }
      #appStartupNotice h2 { font-size: 20px; }
      #appStartupNotice[role="alert"] { visibility: visible; }
      #appStartupReload {
        justify-self: start;
        min-width: 44px;
        min-height: 44px;
        border: 1px solid #1f7a62;
        border-radius: 6px;
        background: #1f7a62;
        color: #fff;
        padding: 8px 16px;
        font: inherit;
        cursor: pointer;
      }
      #appStartupReload:focus-visible { outline: 3px solid #18382d; outline-offset: 3px; }
      #appStartupReload[aria-disabled="true"] { cursor: wait; opacity: .7; }
    </style>
    <script>
      (() => {
        document.documentElement.classList.add("app-styles-loading");
        const startupHref = window.location.href;
        const failedStyles = new Set();
        let moduleFailed = false;
        let startupNotice = null;
        let reloading = false;
        const ownsStartup = () => window.location.href === startupHref
          || document.documentElement.classList.contains("app-module-loading");
        const renderStartupNotice = () => {
          if (!document.body || !ownsStartup() || !moduleFailed && !failedStyles.size) return;
          if (!startupNotice?.isConnected) {
            const notice = document.createElement("section");
            notice.id = "appStartupNotice";
            notice.setAttribute("aria-labelledby", "appStartupTitle");
            notice.setAttribute("aria-describedby", "appStartupMessage");
            const title = document.createElement("h2");
            title.id = "appStartupTitle";
            const message = document.createElement("p");
            message.id = "appStartupMessage";
            const reload = document.createElement("button");
            reload.id = "appStartupReload";
            reload.type = "button";
            reload.textContent = "重新加载页面";
            reload.addEventListener("click", () => {
              if (reloading || startupNotice !== notice || !notice.isConnected) return;
              reloading = true;
              reload.setAttribute("aria-disabled", "true");
              reload.setAttribute("aria-busy", "true");
              window.location.reload();
            });
            notice.append(title, message, reload);
            startupNotice = notice;
            document.body.prepend(notice);
          }
          startupNotice.setAttribute("role", moduleFailed ? "alert" : "status");
          startupNotice.querySelector("h2").textContent = moduleFailed ? "页面未能启动" : "部分页面样式未加载";
          startupNotice.querySelector("p").textContent = moduleFailed
            ? "页面所需内容加载失败。请检查网络连接，再重新加载页面。"
            : "页面仍可继续使用，显示可能不完整。可以重新加载页面再试。";
        };
        window.__fanhaoReportStartupFailure = () => {
          if (!ownsStartup()) return;
          moduleFailed = true;
          renderStartupNotice();
        };
        document.addEventListener("DOMContentLoaded", renderStartupNotice, { once: true });
        const shortVideoEntry = /^\/(?:short-videos|short-video|douyin)(?:\/|$)/.test(window.location.pathname);
        const shortVideoModuleUrl = "/short-video-app.min.js?v=bundle-a6283233aace";
        if (shortVideoEntry) {
          const modulePreload = document.createElement("link");
          modulePreload.rel = "modulepreload";
          modulePreload.href = shortVideoModuleUrl;
          modulePreload.fetchPriority = "high";
          document.head.append(modulePreload);
          window.__fanhaoShortVideoModuleUrl = shortVideoModuleUrl;
        }
        const shortVideoStyleUrls = [
          "/css/foundation.css?v=20260710-web-css-modules-01",
          "/css/shell.css?v=20260713-search-index-02",
          "/modules/short-videos/styles/list.css?v=20260917-author-delete-01",
          "/modules/short-videos/styles/viewer.css?v=20261027-caption-01",
          "/modules/short-videos/styles/gallery-navigation.css?v=20260711-player-modal-focus-75",
          "/modules/short-videos/styles/panels.css?v=20261027-speed-picker-01",
          "/modules/short-videos/styles/responsive.css?v=20261027-caption-01"
        ];
        const shortVideoViewerStyleUrls = [
          "/modules/short-videos/styles/viewer.css?v=20261027-caption-01",
          "/modules/short-videos/styles/gallery-navigation.css?v=20260711-player-modal-focus-75"
        ];
        const fanhaoStyleUrls = [
          "/css/foundation.css?v=20260710-web-css-modules-01",
          "/css/shell.css?v=20260713-search-index-02",
          "/modules/fanhao/styles.css?v=20260724-code-prefix-catalog-01",
          "/modules/fanhao/work-cards.css?v=20261023-traits-01",
          "/modules/system/admin.css?v=20260727-hidden-overlays-01",
          "/css/player.css?v=20260710-web-css-modules-01",
          "/css/responsive.css?v=20260712-module-settings-02",
          "/modules/fanhao/browse-refinements.css?v=20261023-person-aliases-01"
        ];
        const galleryStyleUrls = [
          "/css/foundation.css?v=20260710-web-css-modules-01",
          "/css/shell.css?v=20260713-search-index-02",
          "/modules/content-index/styles.css?v=20260717-photo-album-parser-02",
          "/modules/content-index/catalog.css?v=20260908-library-browse-01"
        ];
        const mangaStyleUrls = [
          "/css/foundation.css?v=20260710-web-css-modules-01",
          "/css/shell.css?v=20260713-search-index-02",
          "/modules/photos/manga.css?v=20260829-manga-library-06"
        ];
        const novelStyleUrls = [
          "/css/foundation.css?v=20260710-web-css-modules-01",
          "/modules/novels/styles.css?v=20260727-novel-manage-04",
          "/css/shell.css?v=20260713-search-index-02",
          "/modules/novels/library.css?v=20260908-novel-library-01",
          "/modules/novels/detail.css?v=20260908-novel-library-01",
          "/modules/novels/reader-refinements.css?v=20260908-novel-library-01"
        ];
        const musicStyleUrls = [
          "/css/foundation.css?v=20260710-web-css-modules-01",
          "/css/shell.css?v=20260713-search-index-02",
          "/modules/music/styles/foundation.css?v=20260711-music-compact-sidebar-10",
          "/modules/music/styles/library.css?v=20260711-music-content-visibility-43",
          "/modules/music/styles/player.css?v=20260711-music-content-visibility-43",
          "/modules/music/styles/responsive.css?v=20260711-music-compact-sidebar-10"
        ];
        const toolsStyleUrls = [
          "/css/foundation.css?v=20260710-web-css-modules-01",
          "/css/shell.css?v=20260713-search-index-02",
          "/modules/tools/styles.css?v=20260727-game-library-redesign-01"
        ];
        const shortVideoDetailEntry = /^\/(?:short-videos|short-video|douyin)\/(?!(?:stats|authors|transcoding)(?:\/|$))[^/]+\/?$/.test(window.location.pathname);
        const standaloneStyleEntry = /^\/(?:gallery|photo|photos|photo-sets|manga|media|video|videos|movie|movies|tv|novel|novels|music|musics|songs|tools)(?:\/|$)/.test(window.location.pathname) || /^\/western\/.+/.test(window.location.pathname);
        document.documentElement.classList.add("app-module-loading");
        const styleUrls = shortVideoEntry
          ? (shortVideoDetailEntry
            ? shortVideoStyleUrls
            : shortVideoStyleUrls.filter((href) => !shortVideoViewerStyleUrls.includes(href)))
          : standaloneStyleEntry
            ? (/^\/manga(?:\/|$)/.test(window.location.pathname) || /^\/photo\/manga(?:\/|$)/.test(window.location.pathname)
              ? mangaStyleUrls
              : /^\/(?:novel|novels)(?:\/|$)/.test(window.location.pathname)
                ? novelStyleUrls
              : /^\/(?:music|musics|songs)(?:\/|$)/.test(window.location.pathname)
                ? musicStyleUrls
                : /^\/tools(?:\/|$)/.test(window.location.pathname)
                  ? toolsStyleUrls
                  : galleryStyleUrls)
            : fanhaoStyleUrls;
        const stylePromises = new Map();
        const loadStyle = (href) => {
          if (stylePromises.has(href)) return stylePromises.get(href);
          const promise = new Promise((resolve) => {
            const link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = href;
            link.fetchPriority = "high";
            link.addEventListener("load", resolve, { once: true });
            link.addEventListener("error", () => {
              resolve();
              if (ownsStartup()) {
                failedStyles.add(href);
                renderStartupNotice();
              }
            }, { once: true });
            document.head.append(link);
          });
          stylePromises.set(href, promise);
          return promise;
        };
        const loadStyleUrls = (urls) => Promise.all(urls.map(loadStyle));
        window.__fanhaoEnsureShortVideoViewerStyles = () => loadStyleUrls(shortVideoViewerStyleUrls);
        window.__fanhaoStylesReady = loadStyleUrls(styleUrls)
          .finally(() => document.documentElement.classList.remove("app-styles-loading"));
      })();
    </script>
  </head>
  <body>
    <script>
      if (/^\/(?:gallery|photo|photos|photo-sets|manga|media|video|videos|movie|movies|tv|novel|novels|short-videos|short-video|douyin|music|musics|songs|tools)(?:\/|$)/.test(window.location.pathname) || /^\/western\/.+/.test(window.location.pathname)) {
        document.body.classList.add("standalone-module-view");
      }
      if (/^\/music(?:\/|$)/.test(window.location.pathname)) document.body.classList.add("music-view");
    </script>

        <a class="product-tab" href="/short-videos" target="_blank" rel="noopener" data-module-navigation="window" data-product-view="shortVideos">短视频</a>
        <a class="product-tab" href="/music" target="_blank" rel="noopener" data-module-navigation="window" data-product-view="music">音乐</a>

      <div class="product-actions">
        <a class="product-action" href="/account">用户中心</a>

        <a class="product-action" id="topAdminLink" href="/admin#overview">设置与运维</a>

    </header>
    <div class="app-shell">
      <aside class="sidebar fanhao-sidebar" aria-label="番号二级菜单">
        <button class="fanhao-navigation-button" id="fanhaoNavigationButton" type="button" aria-haspopup="dialog" aria-controls="fanhaoNavigationDialog" aria-expanded="false">栏目 · 人物</button>
        <div class="fanhao-sidebar-heading">

        </div>

          <div class="fanhao-nav-group" role="group" aria-labelledby="fanhaoBrowseLabel">
            <h3 id="fanhaoBrowseLabel">资料浏览</h3>
            <a class="view-tab active" href="/fanhao" data-view="people" data-people-scope="main" aria-current="page">人物</a>
            <a class="view-tab" href="/fanhao/codes" data-view="codes">番号</a>

            <a class="view-tab" href="/fanhao/vr" data-view="vr">VR</a>
            <a class="view-tab" href="/western" data-view="people" data-people-scope="western">欧美</a>

          </label>

          </div>
        </header>

        <section class="person-profile" id="personProfile" hidden></section>
        <section class="stats-row" id="statsRow"></section>

    <dialog class="fanhao-navigation-dialog" id="fanhaoNavigationDialog" aria-labelledby="fanhaoNavigationTitle">

        <div>
          <div class="eyebrow" id="drawerPath"></div>
          <h3 id="drawerTitle"></h3>
        </div>

          <span aria-hidden="true">×</span>
        </button>

        <div class="player-area" id="playerArea"></div>

      </div>

    <template id="placeholderTemplate">
      <div class="placeholder-cover">
        <span>NO COVER</span>
      </div>
    </template>

    <script type="module" src="/js/product-context.js"></script>
    <script type="module">
      const pathname = window.location.pathname;
      const shortVideoEntry = /^\/(?:short-videos|short-video|douyin)(?:\/|$)/.test(pathname);
      const standaloneEntry = /^\/(?:gallery|photo|photos|photo-sets|manga|media|video|videos|movie|movies|tv|novel|novels|music|musics|songs|tools)(?:\/|$)/.test(pathname) || /^\/western\/.+/.test(pathname);
      if (shortVideoEntry) {
        const shortVideoModulePromise = import("/short-video-app.min.js?v=bundle-a6283233aace");
        shortVideoModulePromise.catch(() => window.__fanhaoReportStartupFailure?.());
        await window.__fanhaoStylesReady;
        try {
          await shortVideoModulePromise;
        } catch {
          window.__fanhaoReportStartupFailure?.();
        } finally {
          document.documentElement.classList.remove("app-module-loading");
        }
      } else if (standaloneEntry) {
        await window.__fanhaoStylesReady;
        try {
          await import("/standalone-app.js?v=20261004-reader-navigation-owner-06");
        } catch {
          window.__fanhaoReportStartupFailure?.();
        } finally {
          document.documentElement.classList.remove("app-module-loading");
        }
      } else {
        await window.__fanhaoStylesReady;
        try {
          await import("/fanhao-app.js?v=20261023-person-aliases-01");
        } catch {
          window.__fanhaoReportStartupFailure?.();
        } finally {
          document.documentElement.classList.remove("app-module-loading");
        }
      }
    </script>
  </body>
</html>
