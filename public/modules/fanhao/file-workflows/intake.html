<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#172e29"><title>视频洗版工作台 · FanHao</title>
  <link rel="icon" href="/app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/modules/fanhao/file-workflows/styles.css">
  <link id="libraryCardStyles" rel="stylesheet" href="/modules/fanhao/work-cards.css" media="not all">
  <link rel="stylesheet" href="/modules/fanhao/file-workflows/intake.css?v=24">
</head>
<body>
  <main id="bench" class="bench" data-view="drop">
    <div id="dropArea" class="drop">
      <div class="drop-card">
        <strong>把视频或文件夹拖到这里</strong>
        <div class="drop-controls">
          <div id="dropQueueDraftSlot">
            <section id="queueDraft" class="queue-draft" aria-label="恢复洗版待核对清单" hidden>
              <p id="queueDraftStatus" role="status"></p>
              <div class="queue-draft-actions">
                <button id="restoreQueueDraft" type="button">恢复待核对清单</button>
                <button id="clearQueueDraft" type="button">清除恢复清单</button>
              </div>
              <details id="queueDraftFailures" hidden><summary>查看未恢复项</summary><ul></ul></details>
            </section>
          </div>
          <span>在本机定位 · 不上传视频</span>
          <div class="actions"><button id="pickFiles" type="button">选择视频</button><button id="pickFolder" type="button">选择文件夹</button></div>
          <form class="path-form"><input aria-label="视频或文件夹完整路径" required autocomplete="off" placeholder="或粘贴视频或文件夹的完整路径"><button type="submit">加入</button></form>
          <button class="open-history link-button" type="button">迁移记录</button>
        </div>
      </div>
    </div>
    <input id="filePicker" type="file" multiple hidden><input id="folderPicker" type="file" webkitdirectory multiple hidden>

    <aside class="side">
      <div id="sideQueueDraftSlot"></div>
      <div class="side-head">
        <h2>待核对 <span id="queueCount" class="badge">0</span></h2>
        <div class="side-tools"><button id="addFiles" type="button" title="选择视频">+ 视频</button><button id="addFolder" type="button" title="选择文件夹">+ 目录</button></div>
      </div>
      <form class="path-form"><input aria-label="视频或文件夹完整路径" required autocomplete="off" placeholder="粘贴路径后回车"></form>
      <div id="queue" class="queue"></div>
      <section id="tasksPanel" class="tasks" aria-label="执行队列" hidden>
        <h3>执行队列 <span id="doneCount"></span></h3>
        <div id="tasks" class="task-list"></div>
      </section>
      <button class="open-history link-button" type="button">迁移记录</button>
    </aside>

    <section class="compare" id="reviewPane" aria-label="新旧文件对照">
      <div class="subtitle-drawer-bar" id="subtitleDrawerBar" hidden>
        <h2>字幕处理</h2>
        <div class="actions">
          <button id="nextSubtitleWork" type="button" hidden>下一部作品</button>
          <button id="closeSubtitleDrawer" type="button" aria-label="关闭字幕浮窗">关闭</button>
        </div>
      </div>
      <p id="subtitleAdvanceStatus" class="subtitle-status" role="status" hidden></p>
      <section id="libraryFilePicker" class="library-file-picker" hidden aria-labelledby="libraryFilePickerTitle">
        <h3 id="libraryFilePickerTitle" tabindex="-1"></h3>
        <div id="libraryFileChoices"></div>
      </section>
      <p id="compareEmpty" class="compare-empty">选中左侧待办开始对照。</p>
      <div id="subtitlePane" class="subtitle-pane" hidden>
        <header class="subtitle-pane-head">
          <div><h2 id="subtitleVideoName" tabindex="-1"></h2><p id="subtitleVideoPath" class="subtitle-path"></p></div>
          <div class="actions"><button id="subtitlePreviewButton" type="button" class="primary" hidden>播放确认</button><button id="subtitleOpenVideo" type="button">打开视频</button><button id="subtitleOpenFolder" type="button">打开文件夹</button></div>
        </header>
        <form id="subtitleCodeForm" class="code-form" hidden>
          <input id="subtitleCode" aria-label="视频番号" maxlength="40" autocomplete="off" placeholder="输入视频番号" required>
          <button type="submit">确认番号</button>
        </form>
        <div id="inlineSubtitleSlot"></div>
        <div id="subtitlePreview" class="subtitle-preview" hidden></div>
      </div>
      <div id="compareBody" class="compare-body" hidden>
        <header class="compare-head">
          <form id="codeForm" class="code-form"><input id="code" aria-label="番号" maxlength="40" autocomplete="off"><button type="submit">重新匹配</button></form>
          <button type="button" id="discard" class="danger">丢弃源视频</button>
          <div id="workMetadata" class="work-info"></div>
        </header>
        <div class="compare-scroll">
          <div class="compare-tools"><div id="versions" class="versions"></div><button id="openBoth" type="button">同时打开两份</button></div>
          <table id="compareTable" class="cmp"></table>
          <p id="noExisting" class="no-existing" hidden>未找到同番号的馆藏视频。</p>
          <div id="newWork" class="new-work" hidden>
            <div class="new-work-head"><h3>新番号入库</h3><button id="fetchMeta" type="button">用 115Chrome 查资料</button></div>
            <form id="metadataUrlForm" class="metadata-url-form">
              <input id="metadataUrl" aria-label="JavDB 作品详情页网址" placeholder="粘贴 JavDB 详情页网址（javdb.com/v/…）" inputmode="url" required maxlength="2048" autocomplete="off" spellcheck="false">
              <button id="fetchMetaUrl" type="submit">从网址读取</button>
            </form>
            <label for="actorTarget">归档人物和目录</label><select id="actorTarget"></select>
          </div>
        </div>
        <footer class="compare-foot">
          <fieldset class="tags"><legend>入库标记</legend><label><input id="tagLtx" type="checkbox" checked>LTX</label><label><input id="tagU" type="checkbox">U 无码</label><label><input id="tagC" type="checkbox">C 中字</label><label><input id="tagA" type="checkbox">[A] 喜欢</label><span id="qualityTag" class="badge" hidden></span></fieldset>
          <div class="foot-actions"><button type="button" id="discardBoth" class="danger" hidden>两份都删除</button><button type="button" id="keep">两份都保留</button><button type="button" id="replace" class="primary">替换所选馆藏</button><button type="button" id="addNew" class="primary">作为新番号入库</button></div>
          <p id="actionHint" class="action-hint" hidden></p>
        </footer>
      </div>
    </section>
  </main>

  <div id="unmatched" class="unmatched" hidden></div>
  <p id="notice" class="toast" role="status" aria-live="polite" hidden></p>

  <dialog id="sourceSubtitles" class="history-dialog" aria-labelledby="sourceSubtitlesTitle">
    <div class="history-head"><h2 id="sourceSubtitlesTitle">源视频字幕</h2><form method="dialog"><button id="closeSourceSubtitles">关闭</button></form></div>
    <p id="librarySubtitleVideo" class="subtitle-path" hidden></p>
    <div id="dialogSubtitleSlot"><div id="sourceSubtitleContent">
      <div class="actions">
        <button id="downloadSourceSubtitle" type="button" class="primary">一键下载字幕</button>
        <button id="searchSourceSubtitles" type="button">查找中文字幕</button>
        <button id="importSourceSubtitle" type="button">导入本地 SRT</button>
        <button id="markSubtitleReviewed" type="button" title="按整部影片记录字幕核查结果" hidden>标记已查无中字</button>
        <button id="markAndNextSubtitleWork" type="button" hidden>标记无中字并继续</button>
        <input id="sourceSubtitlePicker" type="file" accept=".srt" hidden>
      </div>
      <p id="sourceSubtitleStatus" class="subtitle-status" role="status"></p>
      <div id="librarySubtitleCopies" class="job-list" aria-label="从待迁移复制" hidden></div>
      <div id="sourceSubtitleAttachments" class="job-list" aria-label="已匹配字幕" hidden></div>
      <div id="sourceSubtitleResults" class="job-list"></div>
    </div></div>
  </dialog>
  <dialog id="markLibrary" aria-labelledby="markTitle"><form method="dialog">
    <h2 id="markTitle">修改馆藏标记</h2><p id="markName" class="confirm-paths"></p>
    <fieldset class="tags"><legend>追加标记</legend><label><input id="markLtx" type="checkbox">LTX</label><label><input id="markU" type="checkbox">U 无码</label><label><input id="markC" type="checkbox">C 中字</label></fieldset>
    <div class="actions"><button value="cancel">返回核对</button><button id="markPreview" value="preview" class="primary">预览重命名</button></div>
  </form></dialog>
  <dialog id="confirm"><form method="dialog"><h2 id="confirmTitle">确认操作</h2><p id="confirmText"></p><dl id="confirmPaths" class="confirm-paths"></dl><fieldset id="discardReasonFields" class="discard-reasons" hidden><legend>丢弃记录（可选）</legend><div id="discardChoices" class="discard-controls"></div><label><input id="discardLtx" type="checkbox"> 待丢弃的是 LTX</label></fieldset><div class="actions"><button id="confirmBack" value="cancel">返回核对</button><button id="confirmRun" value="run" class="primary">确认提交</button></div></form></dialog>
  <dialog id="history" class="history-dialog">
    <div class="history-head"><h2>迁移记录</h2><div class="job-actions"><button id="discardStatsToggle" type="button" aria-expanded="false">丢弃统计</button><form method="dialog"><button>关闭</button></form></div></div>
    <div id="jobs" class="job-list"></div>
    <section id="discardStats" hidden>
      <div class="discard-controls"><label for="discardFilter">原因</label><select id="discardFilter"></select><label><input id="onlyLtx" type="checkbox"> 只看 LTX</label></div>
      <p id="discardSummary" class="queue-empty" aria-live="polite"></p>
      <div id="discardRecords" class="job-list"></div>
      <div id="discardPagination" class="discard-controls" hidden><button id="discardPrev" type="button">上一页</button><span id="discardPage"></span><button id="discardNext" type="button">下一页</button></div>
    </section>
  </dialog>
  <section id="librarySearch" class="library-search" aria-label="搜索馆藏视频" hidden>
    <header class="library-search-head">
      <form id="librarySearchForm" class="path-form" role="search">
        <input type="search" aria-label="搜索馆藏番号、标题或人物" placeholder="搜索番号、标题或人物" maxlength="200" autocomplete="off">
        <button type="submit" class="primary">搜索馆藏</button>
      </form>
      <div id="librarySearchActions" class="library-search-actions" hidden>
        <button id="resumeLibraryBrowse" type="button" hidden>继续上次</button>
        <details id="libraryLocalFiles" class="library-local-files">
          <summary>从本机加入</summary>
        </details>
      </div>
    </header>
    <div id="libraryResumeTools" class="library-resume-tools" hidden>
      <span id="libraryResumeStatus" role="status"></span>
      <button id="restartLibraryBrowse" type="button" hidden>从头浏览</button>
    </div>
    <div id="libraryBrowseTools" class="library-browse-tools" hidden>
      <div class="library-filter-controls">
        <button id="libraryOnlyMarkedA" type="button" aria-pressed="false">只看 A</button>
        <button id="excludeChineseSubtitles" type="button" aria-pressed="false" title="隐藏有内嵌中字标记或已匹配中文字幕外挂的作品">排除中字</button>
        <button id="excludeLibraryVr" type="button" aria-pressed="false">排除 VR</button>
        <button id="libraryOnlyUnreviewed" type="button" aria-pressed="false">仅看未核查</button>
        <div class="library-classifications" role="group" aria-label="媒体分类">
          <button type="button" data-classification="" aria-pressed="true">全部</button>
          <button type="button" data-classification="ltx" aria-pressed="false">LTX</button>
          <button type="button" data-classification="ltx-local" aria-pressed="false">LTX 本地</button>
          <button type="button" data-classification="4k" aria-pressed="false">4K</button>
          <button type="button" data-classification="1080p" aria-pressed="false">1080p</button>
          <button type="button" data-classification="720p" aria-pressed="false">720p</button>
          <button type="button" data-classification="mp4" aria-pressed="false">MP4</button>
          <button type="button" data-classification="mkv" aria-pressed="false">MKV</button>
          <button type="button" data-classification="wmv" aria-pressed="false">WMV</button>
        </div>
      </div>
      <div class="library-browse-options">
        <label>排序 <select id="librarySort"><option value="releaseDesc">发行最新</option><option value="updated">最近更新</option><option value="ratingDesc">评分最高</option></select></label>
        <label>卡片大小 <select id="libraryCardSize"><option value="large">大图</option><option value="compact">小图</option></select></label>
      </div>
    </div>
    <details id="libraryQueue" class="library-queue" hidden><summary id="libraryQueueTitle">待处理视频</summary></details>
    <div class="library-catalog-body">
      <aside id="libraryPeople" class="library-people" aria-label="按人物筛选馆藏" hidden>
        <details id="libraryPeoplePanel" open>
          <summary>人物</summary>
          <input id="libraryPeopleQuery" type="search" aria-label="筛选人物" placeholder="筛选人物" autocomplete="off">
          <p id="libraryPeopleStatus" role="status"></p>
          <button id="retryLibraryPeople" type="button" hidden>重试读取人物</button>
          <div id="libraryPeopleList" class="library-people-list"></div>
        </details>
      </aside>
      <div class="library-catalog-grid">
        <p id="librarySearchStatus" class="library-search-status" role="status" hidden></p>
        <div id="librarySearchResults" class="library-search-results" aria-label="馆藏搜索结果" hidden></div>
        <div id="libraryLoadMore" class="library-load-more" hidden>
          <span id="libraryLoadStatus" role="status"></span>
          <button id="retryLibraryLoad" type="button" hidden>重试加载</button>
        </div>
      </div>
    </div>
  </section>
  <script type="module" src="/modules/fanhao/file-workflows/intake.js?v=48"></script>
</body>
</html>
