<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1013">
  <meta name="fanhao-ltx" content="1">
  <title>LTX 资源库 · FanHao</title>
  <script>
    {
      const filters = new URLSearchParams(location.search);
      const recent = filters.get("sort") === "recent"
        && !["q", "actor", "status", "local", "subtitle", "order"].some((key) => filters.has(key));
      const catalog = document.createElement("link");
      catalog.id = "catalogPreload";
      catalog.rel = "preload";
      catalog.as = "fetch";
      catalog.crossOrigin = "";
      catalog.href = recent ? "/api/fanhao/ltx?preview=recent" : "/api/fanhao/ltx";
      document.head.append(catalog);
    }
  </script>
  <link rel="icon" href="/app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/modules/fanhao/ltx/source-ui.css">
  <link rel="stylesheet" href="/modules/fanhao/ltx/styles.css?v=20261117-ltx-scroll">
  <link rel="modulepreload" href="/modules/fanhao/ltx/filter-views.js?v=20261113-ltx-filter-views-01">
  <script type="module" src="/modules/fanhao/ltx/page.js?v=20261117-ltx-preview-verified"></script>
</head>
<body>
  <div id="app" class="ready">
    <a class="skip" data-v-ff5b15bf href="#catalog">跳到作品</a>
    <header class="header" data-v-db15c80d data-v-ff5b15bf>
      <button id="openActors" class="menu-btn" data-v-db15c80d type="button" aria-controls="actor-panel" aria-expanded="false" aria-label="筛选人物"></button>
      <h1 class="brand" data-v-db15c80d>
        <a class="home" data-v-db15c80d href="/fanhao/ltx" aria-label="LTX 资源库首页">
          <span class="mark" data-v-db15c80d>Jasna-LTX</span><span class="name" data-v-db15c80d>资源库</span>
        </a>
      </h1>
      <div class="fanhao-header-search">
        <div class="search-wrap" data-v-db15c80d>
          <svg class="search-icon" data-v-db15c80d viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="search" class="search" data-v-db15c80d type="search" placeholder="搜索番号 / 标题 / 人物 / 片商 / 分类" aria-label="搜索番号、标题、人物、片商、分类" autocomplete="off">
          <kbd class="kbd" data-v-db15c80d>/</kbd>
        </div>
        <div id="sort" class="sort" data-v-276abc24 data-v-db15c80d role="group" aria-label="排序"></div>
        <label class="fanhao-pill fanhao-local-filter">
          <span>本地状态</span>
          <select id="filter" aria-label="本地状态">
            <option value="all">全部</option>
            <option value="present">本地有视频</option>
            <option value="marked">文件已标 LTX</option>
            <option value="ltx-local">LTX 本地</option>
            <option value="unmarked" hidden>本地有视频，文件未标 LTX</option>
            <option value="unmarked-non4k">本地有视频 · 非 4K · 文件未标 LTX</option>
            <option value="unmarked-4k">本地有视频 · 4K 及以上 · 文件未标 LTX</option>
            <option value="remote-larger">远端 LTX 体积大于本地</option>
            <option value="missing">当前未发现视频</option>
          </select>
        </label>
      </div>
      <nav class="fanhao-header-links" aria-label="FanHao 工具">
        <a class="fanhao-pill" href="/fanhao">番号库</a>
        <a class="fanhao-pill" href="/fanhao/file-workflows/intake">洗版工作站</a>
      </nav>
      <button id="syncCatalog" class="fanhao-pill" type="button" title="从 Jasna-LTX 同步最新目录">更新目录</button>
    </header>

    <div class="layout" data-v-ff5b15bf>
      <div id="actorScrim" class="scrim" data-v-e8550fad hidden></div>
      <aside id="actor-panel" class="side" data-v-e8550fad aria-label="人物筛选">
        <div class="sheet-head" data-v-e8550fad>
          <b data-v-e8550fad>筛选人物</b>
          <button id="closeActors" class="close" data-v-e8550fad type="button" aria-label="关闭人物筛选">×</button>
        </div>
        <div class="head" data-v-e8550fad>
          <input id="actorSearch" class="filter" data-v-e8550fad type="search" placeholder="筛选人物" aria-label="筛选人物" autocomplete="off">
        </div>
        <span id="actorCount" class="fanhao-actor-count" role="status"></span>
        <nav id="actors" class="actors" data-v-e8550fad aria-label="人物列表"></nav>
      </aside>
      <main id="catalog" class="main" data-v-ff5b15bf tabindex="-1">
        <h2 class="sr-only">LTX 作品目录</h2>
        <div class="bar" data-v-ff5b15bf>
          <div id="status" class="status" data-v-ff5b15bf role="group" aria-label="资源确认状态"></div>
          <span id="localVolume" class="fanhao-local-volume" role="status" hidden></span>
          <button id="actorChip" class="chip" data-v-ff5b15bf type="button" hidden></button>
          <label class="tool fanhao-subtitle-filter" data-v-ff5b15bf>
            <select id="subtitleFilter" aria-label="字幕筛选">
              <option value="all">全部字幕状态</option>
              <option value="available">有中文字幕</option>
              <option value="ltx-c">LTX-C 版本</option>
            </select>
          </label>
          <div class="bar-end" data-v-ff5b15bf>
            <button id="batchLinks" class="tool primary" data-v-ff5b15bf type="button" disabled>批量操作 <b id="batchCount" data-v-ff5b15bf>0</b></button>
            <span id="results" class="result" data-v-ff5b15bf role="status"></span>
            <span id="snapshot" class="updated" data-v-ff5b15bf>正在读取本地快照…</span>
            <button id="reload" class="tool" data-v-ff5b15bf type="button">重读本地状态</button>
            <button id="openFilterViews" class="tool" data-v-ff5b15bf type="button" aria-haspopup="dialog">筛选视图</button>
            <button id="displaySettings" class="tool" data-v-ff5b15bf type="button">显示设置</button>
          </div>
        </div>
        <div id="feedback" class="fanhao-feedback" role="status"></div>
        <div id="grid" class="grid" data-v-ff5b15bf aria-label="LTX 作品"></div>
        <div id="empty" class="none" data-v-ff5b15bf hidden><p>没有符合条件的作品。</p></div>
        <div id="sentinel" class="sentinel" data-v-ff5b15bf></div>
        <button id="loadMore" class="tool fanhao-more" data-v-ff5b15bf type="button" hidden>加载更多</button>
      </main>
    </div>
  </div>

  <dialog id="catalogImport" class="dialog fanhao-dialog" data-v-942e16ed aria-labelledby="catalogImportTitle">
    <div class="inner" data-v-942e16ed>
      <div class="top" data-v-942e16ed>
        <h2 id="catalogImportTitle" data-v-942e16ed>更新目录</h2>
        <form method="dialog"><button class="close" data-v-942e16ed aria-label="关闭目录导入">×</button></form>
      </div>
      <p class="note" data-v-942e16ed>官网已换域名，请更新同步脚本。按官网提示完成验证，FanHao 收到可用目录后会自动导入。</p>
      <div class="fanhao-import-actions">
        <button id="openCatalogSync" class="btn primary" data-v-942e16ed type="button">打开并同步</button>
        <button id="catalogImportClipboard" class="btn" data-v-942e16ed type="button">从剪贴板导入目录</button>
        <a class="btn" data-v-942e16ed href="/modules/fanhao/ltx/fanhao-ltx-sync-v2.user.js?v=2.0.0" target="_blank" rel="noopener">安装或更新同步脚本</a>
      </div>
      <details id="catalogImportManual">
        <summary>手动导入 JSON</summary>
        <div class="fanhao-import-actions">
          <a class="btn" data-v-942e16ed href="https://ltxlib.dpdns.org/" target="_blank" rel="noopener noreferrer">打开官网</a>
          <button id="catalogImportChoose" class="btn" data-v-942e16ed type="button">选择 JSON 文件</button>
          <input id="catalogImportFile" type="file" accept=".json,application/json" hidden>
        </div>
        <form id="catalogImportForm" class="fanhao-view-form">
          <label>目录 JSON <textarea id="catalogImportJson" class="fanhao-view-input" rows="4" required spellcheck="false"></textarea></label>
          <button id="catalogImportSubmit" class="btn primary" data-v-942e16ed type="submit">导入目录</button>
        </form>
      </details>
      <p id="catalogImportStatus" class="note fanhao-dialog-status" data-v-942e16ed role="status"></p>
    </div>
  </dialog>

  <dialog id="filterViews" class="dialog fanhao-dialog" data-v-942e16ed aria-labelledby="filterViewsTitle">
    <div class="inner" data-v-942e16ed>
      <div class="top" data-v-942e16ed>
        <h2 id="filterViewsTitle" data-v-942e16ed>筛选视图</h2>
        <form method="dialog"><button class="close" data-v-942e16ed aria-label="关闭筛选视图">×</button></form>
      </div>
      <form id="saveFilterView" class="fanhao-view-form">
        <label>视图名称 <input id="filterViewName" type="text" maxlength="48" autocomplete="off" required></label>
        <button class="btn primary" data-v-942e16ed type="submit">保存当前筛选</button>
      </form>
      <ul id="savedFilterViews" class="fanhao-view-list" aria-label="此浏览器保存的筛选"></ul>
      <p id="filterViewsEmpty" class="note" data-v-942e16ed>此浏览器还没有保存筛选。</p>
      <div class="actions fanhao-dialog-actions" data-v-942e16ed>
        <button id="copyFilterView" class="btn" data-v-942e16ed type="button">复制当前筛选链接</button>
        <button id="resetFilterView" class="btn" data-v-942e16ed type="button">重置当前筛选</button>
      </div>
      <input id="filterViewLink" class="fanhao-view-input" aria-label="当前筛选链接" type="url" readonly hidden>
      <p id="filterViewsStatus" class="note fanhao-dialog-status" data-v-942e16ed role="status"></p>
    </div>
  </dialog>

  <dialog id="displayDialog" class="dialog fanhao-dialog" data-v-942e16ed aria-labelledby="displayTitle">
    <div class="inner" data-v-942e16ed>
      <div class="top" data-v-942e16ed>
        <h2 id="displayTitle" data-v-942e16ed>显示设置</h2>
        <form method="dialog"><button class="close" data-v-942e16ed aria-label="关闭">×</button></form>
      </div>
      <div class="fanhao-display-options">
        <label><input type="checkbox" data-display="original"> 显示日文原标题</label>
        <label><input type="checkbox" data-display="added"> 显示 LTX 入库时间</label>
        <label><input type="checkbox" data-display="detail"> 显示详情链接</label>
        <label><input type="checkbox" data-display="subtitle"> 显示字幕标记和入口</label>
      </div>
    </div>
  </dialog>
  <dialog id="batchDialog" class="dialog fanhao-dialog" data-v-942e16ed aria-labelledby="batchTitle">
    <div class="inner" data-v-942e16ed>
      <div class="top" data-v-942e16ed>
        <h2 id="batchTitle" data-v-942e16ed>批量操作</h2>
        <form method="dialog"><button class="close" data-v-942e16ed aria-label="关闭">×</button></form>
      </div>
      <label class="fanhao-batch-field">选取规则
        <select id="batchMode">
          <option value="unmarked">本地有视频，未标 LTX</option>
          <option value="larger">远端 LTX 体积大于本地</option>
          <option value="missing">本地没有视频</option>
        </select>
      </label>
      <p class="note" data-v-942e16ed>跳过本地同体积的链接。同一作品优先选体积最大的可用版本。</p>
      <p class="note" data-v-942e16ed>每隔约 2 秒复制一条链接到剪贴板。请保持本页在前台，并在 115 查看接收结果。</p>
      <p id="batchSummary" class="note" data-v-942e16ed role="status"></p>
      <ul id="batchList" class="fanhao-batch-list" aria-label="本批链接预览"></ul>
      <p id="batchStatus" class="note fanhao-dialog-status" data-v-942e16ed role="status"></p>
      <div class="actions fanhao-dialog-actions" data-v-942e16ed>
        <a class="btn" data-v-942e16ed href="https://115.com/?tab=offline&amp;mode=wangpan" target="_blank" rel="noopener noreferrer">打开 115 云下载</a>
        <button id="stopBatch" class="btn" data-v-942e16ed type="button" hidden>停止</button>
        <button id="submitBatch" class="btn primary" data-v-942e16ed type="button" disabled>逐条添加</button>
      </div>
    </div>
  </dialog>
  <dialog id="coverDialog" class="dialog fanhao-dialog fanhao-cover-dialog" data-v-942e16ed aria-labelledby="coverTitle">
    <div class="inner" data-v-942e16ed>
      <div class="top" data-v-942e16ed>
        <h2 id="coverTitle" data-v-942e16ed></h2>
        <form method="dialog"><button class="close" data-v-942e16ed aria-label="关闭封面">×</button></form>
      </div>
      <img id="coverPreview" alt="">
    </div>
  </dialog>
</body>
</html>
