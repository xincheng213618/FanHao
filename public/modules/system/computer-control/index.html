<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17241f" />
    <title>电脑控制 · FanHao</title>
    <link rel="icon" href="/app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/modules/system/computer-control/styles.css?v=20260919-system-control-01" />
  </head>
  <body>
    <main class="control-shell">
      <header class="control-head">
        <a class="brand" href="/fanhao" aria-label="返回 FanHao">
          <span>FH</span>
          <strong>FanHao</strong>
        </a>
        <a class="admin-link" href="/admin#settings">设置与运维</a>
      </header>

      <section class="hero">
        <p class="eyebrow">SYSTEM CONTROL</p>
        <h1>电脑控制</h1>
        <p>控制运行 FanHao 主服务的这台电脑，不再需要单独启动 Python 控制脚本。</p>
        <div class="platform-status" id="platformStatus">正在确认系统能力…</div>
      </section>

      <section class="control-grid" id="controlGrid" aria-label="电脑控制操作" aria-busy="true"></section>

      <section class="notice" aria-live="polite">
        <strong id="noticeTitle">准备就绪</strong>
        <span id="noticeText">关机与重启会保留 60 秒取消时间。</span>
      </section>
    </main>
    <script type="module" src="/modules/system/computer-control/app.js?v=20260919-system-control-01"></script>
  </body>
</html>
