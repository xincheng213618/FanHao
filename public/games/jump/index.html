<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#d6dbdf">
    <meta name="description" content="基于开源 Three.js 项目改造的网页蓄力跳台小游戏。">
    <title>蓄力跳台 · 资料库</title>
    <link rel="stylesheet" href="./styles.css?v=20260718-jump-01">
    <script src="./integration.js?v=20260718-jump-01" defer></script>
    <script src="./game.a87e6d4f5755295c82b3.js" defer></script>
  </head>
  <body>
    <a class="back-link" href="/tools" aria-label="返回资料库小工具">
      <span aria-hidden="true">←</span>
      <span class="back-label">返回资料库</span>
    </a>

    <header class="game-brand" aria-label="蓄力跳台">
      <span class="brand-mark" aria-hidden="true"><i></i></span>
      <span>
        <strong>蓄力跳台</strong>
        <small>THREE.JS · WEB ONLY</small>
      </span>
    </header>

    <section class="scoreboard" aria-label="游戏分数">
      <span><small>本局</small><strong id="scoreValue">0</strong></span>
      <i aria-hidden="true"></i>
      <span><small>最佳</small><strong id="bestValue">0</strong></span>
    </section>

    <main class="status-layer">
      <section id="loadingPanel" class="status-card loading-card" aria-live="polite">
        <span class="loader" aria-hidden="true"></span>
        <strong>正在准备跳台</strong>
        <small id="loadingDetail">加载 Three.js 场景</small>
      </section>

      <section id="gameOverPanel" class="status-card game-over-card" aria-live="assertive" hidden>
        <span class="eyebrow">GAME OVER</span>
        <strong>差一点，再来一次</strong>
        <p>本局跳过 <b id="finalScore">0</b> 个跳台，最佳 <b id="finalBest">0</b>。</p>
        <button id="restartButton" type="button">重新开始</button>
      </section>

      <section id="errorPanel" class="status-card error-card" aria-live="assertive" hidden>
        <span class="eyebrow">WEBGL</span>
        <strong>场景加载失败</strong>
        <p id="errorDetail">请确认浏览器已开启硬件加速后刷新页面。</p>
        <button id="retryButton" type="button">刷新重试</button>
      </section>
    </main>

    <footer class="play-hint" id="playHint" aria-live="polite">
      <span aria-hidden="true"></span>
      <strong id="hintText">按住画面蓄力，松开起跳</strong>
    </footer>

    <noscript>这个小游戏需要启用 JavaScript。</noscript>
  </body>
</html>
