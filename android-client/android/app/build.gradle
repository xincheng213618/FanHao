    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

def localOnlyMarker = file("${buildDir}/outputs/apk/debug/app-debug.apk.local-only.json")
def localOnlyGuard = file("${buildDir}/outputs/apk/app-debug.local-only.guard.json")
def updatePendingLocalOnlyMarker = { markerValue, enabledValue, codeValue, nameValue, simulateFailureValue ->
    File marker = markerValue as File
    def enabled = enabledValue == true
    def simulateFailure = simulateFailureValue == true
    if (!enabled) {
        if (marker.exists() && !marker.delete()) {
            throw new GradleException("Could not clear stale local-only APK marker: ${marker}")
        }
        return
    }

    marker.parentFile.mkdirs()
    def temporaryMarker = new File(marker.parentFile, ".${marker.name}.${UUID.randomUUID()}.tmp")
    try {
        temporaryMarker.setText(JsonOutput.toJson([
            kind: "fanhao-debug-local-only-pending",
            versionCode: codeValue,
            versionName: nameValue
        ]) + System.lineSeparator(), "UTF-8")
        if (simulateFailure) throw new GradleException("simulated pending marker failure")
        try {
            Files.move(temporaryMarker.toPath(), marker.toPath(), StandardCopyOption.ATOMIC_MOVE, StandardCopyOption.REPLACE_EXISTING)
        } catch (AtomicMoveNotSupportedException ignored) {
            Files.move(temporaryMarker.toPath(), marker.toPath(), StandardCopyOption.REPLACE_EXISTING)
        }
    } finally {
        if (temporaryMarker.exists()) temporaryMarker.delete()
    }
}

tasks.configureEach { candidate ->
    if (candidate.name == "packageDebug") {
        candidate.outputs.upToDateWhen { !fanhaoLocalOnly }
        candidate.doFirst {
            if (fanhaoLocalOnly) {
                updatePendingLocalOnlyMarker(localOnlyGuard, true, fanhaoVersionCode, fanhaoVersionName, false)
            }
        }
        candidate.doLast {
            if (fanhaoLocalOnly) {
                updatePendingLocalOnlyMarker(localOnlyMarker, true, fanhaoVersionCode, fanhaoVersionName, false)
            } else {
                updatePendingLocalOnlyMarker(localOnlyMarker, false, fanhaoVersionCode, fanhaoVersionName, false)
                updatePendingLocalOnlyMarker(localOnlyGuard, false, fanhaoVersionCode, fanhaoVersionName, false)
            }
        }
    }
    if (candidate.name == "assembleDebug") {
        candidate.outputs.upToDateWhen { false }
        candidate.doLast {
            if (fanhaoLocalOnly && (!localOnlyMarker.isFile() || !localOnlyGuard.isFile())) {
                throw new GradleException("Local-only assembleDebug completed without its pending marker/guard: ${localOnlyMarker}")
            }
            if (!fanhaoLocalOnly) {
                updatePendingLocalOnlyMarker(localOnlyMarker, false, fanhaoVersionCode, fanhaoVersionName, false)
                updatePendingLocalOnlyMarker(localOnlyGuard, false, fanhaoVersionCode, fanhaoVersionName, false)
            }
        }
    }
}

tasks.register("verifyFanHaoVersionPolicy") {
    group = "verification"
    description = "Exercises the Android publishable/local-only version namespace boundary."
    doLast {
        validateVersionNamespace(99999999, false)
        validateVersionNamespace(100000000, true)
        validateVersionNamespace(2100000000, true)

        def expectRejected = { Closure action, String label ->
            boolean rejected = false
            try {
                action.call()
            } catch (GradleException ignored) {
                rejected = true
            }
            if (!rejected) throw new GradleException("version policy fixture did not reject ${label}")
        }
        expectRejected({ validateVersionNamespace(100000000, false) }, "unmarked high versionCode")
        expectRejected({ validateVersionNamespace(99999999, true) }, "local-only code below its namespace")
        expectRejected({ validateVersionNamespace(2100000001L, true) }, "local-only code above Android's ceiling")

        def fixtureDir = file("${buildDir}/tmp/fanhao-version-policy-fixture")
        fixtureDir.mkdirs()
        def fixtureMarker = new File(fixtureDir, "app-debug.apk.local-only.json")
        try {
            updatePendingLocalOnlyMarker(fixtureMarker, true, 100000000, "local-fixture", false)
            if (!fixtureMarker.isFile()) throw new GradleException("local-only marker fixture was not generated")
            def pending = new JsonSlurper().parse(fixtureMarker)
            if (pending.kind != "fanhao-debug-local-only-pending" || pending.versionCode != 100000000) {
                throw new GradleException("local-only marker fixture identity is invalid")
            }

            def markerBeforeFailure = fixtureMarker.text
            boolean simulatedFailureObserved = false
            try {
                updatePendingLocalOnlyMarker(fixtureMarker, true, 100000000, "failure-fixture", true)
            } catch (GradleException expected) {
                simulatedFailureObserved = expected.message == "simulated pending marker failure"
            }
            if (!simulatedFailureObserved || !fixtureMarker.isFile() || fixtureMarker.text != markerBeforeFailure || fixtureDir.listFiles().any { it.name.endsWith(".tmp") }) {
                throw new GradleException("failed local-only marker replacement did not preserve the prior fail-closed marker")
            }

            updatePendingLocalOnlyMarker(fixtureMarker, false, 99999999, "publishable-fixture", false)
            if (fixtureMarker.exists()) throw new GradleException("publishable marker fixture was not cleared after success")

            def hugeContract = new File(fixtureDir, "huge-version.json")
            hugeContract.setText('''{
  "schemaVersion": 18446744073709551617,
  "packageName": "local.fanhao.library",
  "channel": "debug",
  "currentVersionCode": 18446744073735632806,
  "highWaterVersionCode": 18446744073735632806,
  "defaultVersionName": "0.1.26081190-debug"
}
''', "UTF-8")
            boolean hugeContractRejected = false
            try {
                readVersionContract(hugeContract)
            } catch (GradleException expected) {
                hugeContractRejected = true
            }
            if (!hugeContractRejected) throw new GradleException("huge JSON integers bypassed the exact contract bounds")
        } finally {
            fixtureDir.listFiles()?.each { it.delete() }
            fixtureDir.delete()
        }
        logger.lifecycle("fanhao-gradle-version-policy: 10 boundary, marker, and contract checks passed")
    }
}

