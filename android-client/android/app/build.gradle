import groovy.json.JsonSlurper
import groovy.json.JsonSlurperClassic
import groovy.json.JsonOutput
import java.nio.file.AtomicMoveNotSupportedException
import java.nio.file.Files
import java.nio.file.StandardCopyOption

apply plugin: 'com.android.application'

def versionContractFile = file("../../version.json")
def isJsonInteger = { value -> value instanceof Integer || value instanceof Long || value instanceof BigInteger }
def requireExactContractInteger = { value, label, maximum ->
    if (!isJsonInteger(value)) {
        throw new GradleException("${label} must be a JSON integer")
    }
    def exact = new BigInteger(value.toString())
    def exactMaximum = new BigInteger(maximum.toString())
    if (exact < BigInteger.ONE || exact > exactMaximum) {
        throw new GradleException("${label} must be between 1 and ${exactMaximum}")
    }
    return exact.longValueExact()
}
def readVersionContract = { contractFileValue ->
    File contractFile = contractFileValue as File
    if (!contractFile.isFile()) {
        throw new GradleException("Android version contract is missing: ${contractFile}")
    }
    def parsed = new JsonSlurperClassic().parse(contractFile)
    def schemaVersion = requireExactContractInteger(parsed.schemaVersion, "Android version contract schemaVersion", 1)
    if (schemaVersion != 1L || parsed.packageName != "local.fanhao.library" || parsed.channel != "debug") {
        throw new GradleException("Android version contract schema/package/channel is invalid: ${contractFile}")
    }
    def currentVersionCode = requireExactContractInteger(parsed.currentVersionCode, "Android version contract currentVersionCode", 99999999)
    def highWaterVersionCode = requireExactContractInteger(parsed.highWaterVersionCode, "Android version contract highWaterVersionCode", 99999999)
    if (currentVersionCode != highWaterVersionCode) {
        throw new GradleException("Android version contract current/high-water values must advance together: ${contractFile}")
    }
    if (!(parsed.defaultVersionName instanceof String) || parsed.defaultVersionName.trim().isEmpty() || parsed.defaultVersionName != parsed.defaultVersionName.trim()) {
        throw new GradleException("Android version contract default versionName is invalid: ${contractFile}")
    }
    return [
        currentVersionCode: currentVersionCode,
        highWaterVersionCode: highWaterVersionCode,
        defaultVersionName: parsed.defaultVersionName
    ]
}
def versionContract = readVersionContract(versionContractFile)
def contractVersionCode = versionContract.currentVersionCode
def contractHighWater = versionContract.highWaterVersionCode

def parseVersionCode = { rawValue, label ->
    def text = rawValue.toString()
    if (!(text ==~ /[0-9]+/)) {
        throw new GradleException("${label} must be a positive integer")
    }
    long parsed
    try {
        parsed = Long.parseLong(text)
    } catch (NumberFormatException error) {
        throw new GradleException("${label} is outside the supported integer range", error)
    }
    if (parsed < 1L || parsed > 2100000000L) {
        throw new GradleException("${label} must be between 1 and 2100000000")
    }
    return parsed.intValue()
}

def propertyVersionCode = project.findProperty("fanhaoVersionCode")
def environmentVersionCode = System.getenv("FANHAO_VERSION_CODE")
def rawVersionCode = propertyVersionCode != null ? propertyVersionCode : (environmentVersionCode != null ? environmentVersionCode : contractVersionCode)
def fanhaoVersionCode = parseVersionCode(rawVersionCode, "fanhaoVersionCode")

def localOnlyProperty = project.findProperty("fanhaoLocalOnly")
if (localOnlyProperty != null && localOnlyProperty.toString() != "true" && localOnlyProperty.toString() != "false") {
    throw new GradleException("fanhaoLocalOnly must be exactly true or false")
}
def fanhaoLocalOnly = localOnlyProperty != null && localOnlyProperty.toString() == "true"
def validateVersionNamespace = { codeValue, localOnlyValue ->
    def code = codeValue.toString().toLong()
    def localOnly = localOnlyValue == true
    if (localOnly && (code < 100000000 || code > 2100000000)) {
        throw new GradleException("local-only fanhaoVersionCode must be between 100000000 and 2100000000")
    }
    if (!localOnly && code > 99999999) {
        throw new GradleException("fanhaoVersionCode above 99999999 requires the explicit fanhaoLocalOnly=true build path")
    }
    return code
}
validateVersionNamespace(fanhaoVersionCode, fanhaoLocalOnly)

def propertyVersionName = project.findProperty("fanhaoVersionName")
def environmentVersionName = System.getenv("FANHAO_VERSION_NAME")
def rawVersionName = propertyVersionName != null ? propertyVersionName : (environmentVersionName != null ? environmentVersionName : versionContract.defaultVersionName)
def fanhaoVersionName = rawVersionName.toString().trim()
if (fanhaoVersionName.isEmpty()) {
    throw new GradleException("fanhaoVersionName must be non-empty after trimming")
}

android {
    namespace = "local.fanhao.library"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "local.fanhao.library"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode fanhaoVersionCode
        versionName fanhaoVersionName
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
