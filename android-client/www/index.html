<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f9" />
    <title>资料库</title>
    <link rel="stylesheet" href="./styles.css?v=20260720-fanhao-detail-layout-01" />
  </head>
  <body>
    <main class="app-shell">
      <header id="moduleChrome" class="module-chrome" aria-label="当前模块工具栏" hidden></header>

      <form id="searchForm" class="search-bar" autocomplete="off" hidden>
        <button id="searchCloseButton" class="search-close-button" type="button" aria-label="关闭搜索">‹</button>
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="搜全库：作品/人物/频道" />
        <button class="search-submit-button" type="submit">搜索</button>
      </form>
      <div id="searchHistory" class="search-history" aria-label="搜索记录" hidden></div>

      <nav class="library-channel-strip" aria-label="内容频道">
        <button type="button" data-open-view="works">
          <strong>番号库</strong>
          <span id="channelWorksCount">默认库</span>
        </button>
        <button type="button" data-open-channel="photo">
          <strong>图库</strong>
          <span id="channelPhotoCount">套图 / 韩漫</span>
        </button>
        <button type="button" data-open-view="novels">
          <strong>小说</strong>
          <span id="channelNovelCount">TXT 阅读</span>
        </button>
        <button type="button" data-open-view="music">
          <strong>音乐</strong>
          <span id="channelMusicCount">本地播放</span>
        </button>
        <button type="button" data-open-view="shortVideos">
          <strong>短视频</strong>
          <span id="channelShortVideoCount">刷视频</span>
        </button>
        <button type="button" data-open-channel="media">
          <strong>影视</strong>
          <span id="channelMediaCount">电影 / 电视剧</span>
        </button>
      </nav>

      <section id="omniSection" class="omni-section" aria-labelledby="omniTitle">
        <div class="section-head">
          <div>
            <p class="section-label">全库概览</p>
            <h2 id="omniTitle">内容频道</h2>
          </div>
          <span id="omniMeta" class="view-meta">正在读取</span>
        </div>
        <div id="omniGrid" class="omni-grid" aria-live="polite">
          <div class="loading-row">正在读取图像和媒体资料库</div>
        </div>
      </section>

      <nav class="quick-strip" aria-label="快捷入口">
        <button type="button" data-open-view="history">
          <strong>继续观看</strong>
          <span id="historyCount">0</span>
        </button>
        <button type="button" data-open-view="favorites">
          <strong>收藏</strong>
          <span id="favoriteCount">0</span>
        </button>
        <button type="button" data-open-view="people">
          <strong>人物</strong>
          <span id="peopleCount">0</span>
        </button>
        <button type="button" data-open-view="works">
          <strong>作品</strong>
          <span id="worksCount">0</span>
        </button>
        <button type="button" data-open-view="rankings">
          <strong>排行榜</strong>
          <span id="rankingsCount">TOP</span>
        </button>
        <button type="button" data-open-view="studios">
          <strong>片商</strong>
          <span>系列浏览</span>
        </button>
        <button type="button" data-open-view="vr">
          <strong>VR</strong>
          <span>沉浸作品</span>
        </button>
        <button type="button" data-open-view="music">
          <strong>音乐</strong>
          <span>本地播放</span>
        </button>
        <button type="button" data-open-view="tools">
          <strong>小游戏</strong>
          <span>2 个</span>
        </button>
        <button type="button" data-open-view="shortVideos">
          <strong>短视频</strong>
          <span>上滑刷</span>
        </button>
      </nav>

      <section id="continueSection" class="continue-section" aria-labelledby="continueTitle" hidden>
        <div class="section-head">
          <div>
            <p class="section-label">继续观看</p>
            <h2 id="continueTitle">最近进度</h2>
          </div>
          <button class="text-button" type="button" data-open-view="history">全部</button>
        </div>
        <div id="continuePreview" class="continue-preview" aria-live="polite"></div>
      </section>

      <section id="recentContentSection" class="recent-content-section" aria-labelledby="recentContentTitle" hidden>
        <div class="section-head">
          <div>
            <p class="section-label">跨频道</p>
            <h2 id="recentContentTitle">最近打开</h2>
          </div>
          <button id="recentContentClear" class="text-button" type="button">清空</button>
        </div>
        <div id="recentContentPreview" class="recent-content-preview" aria-live="polite"></div>
      </section>

      <section class="status-card" aria-labelledby="statusTitle">
        <div class="status-head">
          <div>
            <p id="statusTitle" class="section-label">当前服务</p>
            <strong id="serverLabel">http://192.168.31.86:29998</strong>
          </div>
          <span id="connectionBadge" class="badge">连接中</span>
        </div>

        <div class="stats-grid" aria-label="资料库统计">
          <div>
            <strong id="statRoots">-</strong>
            <span>盘</span>
          </div>
          <div>
            <strong id="statPeople">-</strong>
            <span>人物</span>
          </div>
          <div>
            <strong id="statVideos">-</strong>
            <span>视频</span>
          </div>
          <div>
            <strong id="statInfo">-</strong>
            <span>资料</span>
          </div>
        </div>

        <button id="openLibraryButton" class="primary-action" type="button">浏览人物</button>
      </section>

      <section class="preview-section" aria-labelledby="previewTitle">
        <div class="section-head">
          <div>
            <p class="section-label">人物索引</p>
            <h2 id="previewTitle">常用入口</h2>
          </div>
          <button class="text-button" type="button" data-open-view="people">全部</button>
        </div>
        <div id="personPreview" class="person-preview" aria-live="polite">
          <div class="loading-row">正在读取资料库</div>
        </div>
      </section>

      <section id="contentPanel" class="content-panel" hidden>
        <div class="section-head">
          <div>
            <p id="viewKicker" class="section-label">资料库</p>
            <h2 id="viewTitle">浏览</h2>
          </div>
          <div class="section-actions">
            <button id="profileSettingsButton" class="profile-settings-button" type="button" aria-label="打开设置" hidden>
              <span aria-hidden="true">⚙</span>
            </button>
            <button id="viewBack" class="text-button" type="button" hidden>返回</button>
          </div>
        </div>
        <div id="viewMeta" class="view-meta"></div>
        <div id="viewContent" class="content-list" aria-live="polite"></div>
      </section>

      <div id="settingsOverlay" class="settings-overlay" hidden>
        <button id="settingsBackdrop" class="settings-backdrop" type="button" aria-label="关闭设置"></button>
        <section id="settingsPanel" class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsSheetTitle">
          <header class="settings-sheet-head">
            <h2 id="settingsSheetTitle">设置</h2>
            <button id="settingsCloseButton" class="settings-close-button" type="button" aria-label="关闭设置">×</button>
          </header>
        <section class="settings-group settings-connection-group" aria-label="服务地址">
          <form id="connectForm" autocomplete="off">
            <label for="serverUrl">服务地址</label>
            <div class="address-row">
              <input id="serverUrl" name="serverUrl" type="url" inputmode="url" autocomplete="url" placeholder="192.168.31.86:29998" required />
              <button type="submit">保存</button>
            </div>
            <p id="statusText" class="status-text" role="status">保持 29998 服务运行</p>
          </form>
          <div class="server-list" aria-label="可选地址">
            <button type="button" data-url="http://xc213618.ddns.me:29998">xc213618.ddns.me</button>
            <button type="button" data-url="http://192.168.31.86:29998">192.168.31.86</button>
            <button type="button" data-url="http://192.168.192.50:29998">192.168.192.50</button>
            <button type="button" data-url="http://172.21.96.1:29998">172.21.96.1</button>
          </div>
        </section>

        <section class="settings-group" aria-labelledby="themeTitle">
          <strong id="themeTitle" class="settings-group-title">主题</strong>
          <div class="segmented-control" aria-label="主题设置">
            <button type="button" data-theme-choice="system">跟随系统</button>
            <button type="button" data-theme-choice="light">浅色</button>
            <button type="button" data-theme-choice="dark">深色</button>
          </div>
        </section>

        <section class="settings-group" aria-labelledby="appUpdateTitle">
          <strong id="appUpdateTitle" class="settings-group-title">应用更新</strong>
          <span id="appUpdateStatus" class="settings-meta">等待检查更新</span>
          <div class="app-version-line" aria-label="应用版本">
            <span>当前 <strong id="appCurrentVersion">-</strong></span>
            <span>最新 <strong id="appLatestVersion">-</strong></span>
          </div>
          <div class="settings-action-row">
            <button id="checkAppUpdateButton" type="button">检查更新</button>
            <button id="installAppUpdateButton" type="button" disabled>下载安装</button>
          </div>
        </section>

        <section class="settings-group" aria-labelledby="cacheTitle">
          <strong id="cacheTitle" class="settings-group-title">缓存</strong>
          <span id="cacheStatus" class="settings-meta">正在检查</span>
          <div class="settings-action-row single-action">
            <button id="clearCacheButton" type="button">清理缓存</button>
          </div>
        </section>
        </section>
      </div>

      <nav class="bottom-nav channel-bottom-nav" aria-label="底部导航">
        <button class="active" type="button" data-fanhao-home data-bottom-key="fanhao">
          <span>番号</span>
        </button>
        <button type="button" data-open-channel="photo" data-bottom-key="photo">
          <span>套图</span>
        </button>
        <button type="button" data-open-channel="media" data-bottom-key="media">
          <span>影视</span>
        </button>
        <button type="button" data-open-view="shortVideos" data-bottom-key="shortVideos">
          <span>短视频</span>
        </button>
        <button type="button" data-open-view="novels" data-bottom-key="novels">
          <span>小说</span>
        </button>
        <button type="button" data-open-view="music" data-bottom-key="music">
          <span>音乐</span>
        </button>
        <button type="button" data-open-view="tools" data-bottom-key="tools">
          <span>我的</span>
        </button>
      </nav>
    </main>

    <script src="./app.js?v=20260720-fanhao-search-state-01" type="module"></script>
  </body>
</html>
