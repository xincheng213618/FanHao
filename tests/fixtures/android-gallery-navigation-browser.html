<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Android 图库导航隔离夹具</title>
    <style>
      :root{color-scheme:light dark;font-family:system-ui,sans-serif}body{max-width:760px;margin:40px auto;padding:20px;line-height:1.6}button{font:inherit;padding:12px 18px;cursor:pointer}code{overflow-wrap:anywhere}#status{white-space:pre-wrap}
    </style>
    <script src="/fixture/browser.mjs" defer></script>
  </head>
  <body>
    <h1>Android 图库导航隔离夹具</h1>
    <p>每次新建运行冻结当前真实 Android 页面、模块和 CSS。后端仅返回合成数据；不代理电脑端服务。浏览器存储按运行编号隔离，同一运行刷新保留真实导航记忆。</p>
    <button id="startRun" type="button">新建隔离运行并打开真实页面</button>
    <p id="status" role="status"></p>
    <p>在真实页面长按/右键底部图库按钮，核对套图、韩漫、电影、电视剧。选择电影后应有合成电影列表；选择电视剧后应能打开剧集和分集。</p>
    <p>建议视口：320×740、390×844、568×320。请求记录：<a href="/fixture/requests">/fixture/requests</a>。媒体仅为合成封面，不验证实际播放或原生插件。</p>
  </body>
</html>
